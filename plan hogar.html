<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>plan hogar</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <meta name="theme-color" content="#2563eb" id="theme-color">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        :root { --primary: #2563eb; --primary-dark: #1d4ed8; }
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; padding-bottom: env(safe-area-inset-bottom); max-width: 480px; margin: 0 auto; }

        .mobile-header { position: sticky; top: 0; z-index: 40; background: white; padding: 12px 16px; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; justify-content: space-between; }
        .mobile-header-title { font-size: 17px; font-weight: 800; color: #1e293b; letter-spacing: -0.02em; }
        .mobile-header-title span { color: var(--primary); }

        .balance-bubble { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; border: 2px solid #93c5fd; box-shadow: 0 2px 8px rgba(37, 99, 235, 0.2); }
        .balance-bubble:active { transform: scale(0.95); }
        .balance-bubble i { font-size: 10px; color: #2563eb; margin-bottom: 1px; }
        .balance-bubble .bubble-amount { font-size: 9px; font-weight: 800; color: #1e40af; line-height: 1; }
        .balance-bubble .bubble-label { font-size: 6.5px; font-weight: 700; color: #3b82f6; text-transform: uppercase; letter-spacing: 0.5px; }

        .tabs-container { display: flex; border-bottom: 1px solid #e2e8f0; background: white; padding: 0 12px; }
        .tab-btn { flex: 1; padding: 10px 8px; background: none; border: none; font-size: 13px; font-weight: 600; color: #94a3b8; cursor: pointer; transition: all 0.2s; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

        /* CATEGORÍAS */
        .categories-scroll {
            display: flex;
            gap: 8px;
            padding: 10px 12px;
            overflow-x: auto;
            scrollbar-width: none;
            background: white;
            border-bottom: 1px solid #f1f5f9;
        }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .category-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 20px;
            background: #f1f5f9;
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
            border: 1px solid transparent;
            flex-shrink: 0;
        }
        .category-chip i { font-size: 11px; }
        .category-chip:active { transform: scale(0.96); }
        .category-chip.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(37,99,235,0.25);
        }
        .category-chip.active i { color: white; }

        .products-container { padding: 4px 12px 24px; }
        .products-grid { display: grid; grid-template-columns: repeat(1, 1fr); gap: 10px; }
        .product-card { border-radius: 12px; overflow: hidden; background: white; border: 1px solid #eef1f5; box-shadow: 0 1px 4px rgba(0,0,0,0.04); position: relative; cursor: pointer; transition: transform .2s, box-shadow .2s; padding: 16px; }
        .product-card:active { transform: scale(0.98); }
        .plan-image { width: 100%; height: 140px; object-fit: cover; border-radius: 10px; margin-bottom: 12px; background: #f1f5f9; }
        .badge-discount { position: absolute; top: 10px; right: 10px; background: #ef4444; color: #fff; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px; z-index: 2; }
        .badge-featured { position: absolute; top: 10px; right: 10px; background: #fbbf24; color: #78350f; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px; z-index: 2; }
        .plan-speed-display { font-size: 32px; font-weight: 900; color: var(--primary); line-height: 1; margin-bottom: 4px; }
        .plan-speed-display span { font-size: 14px; font-weight: 500; }
        .product-name { font-weight: 600; font-size: 14px; color: #1e293b; margin-bottom: 4px; }
        .product-description { font-size: 11px; color: #94a3b8; margin-bottom: 8px; }
        .price-row { display: flex; align-items: baseline; gap: 6px; margin-bottom: 10px; }
        .product-price { color: var(--primary); font-weight: 800; font-size: 18px; }
        .product-price-old { color: #cbd5e1; font-size: 11px; text-decoration: line-through; }
        .features-list { list-style: none; padding: 0; margin: 0 0 12px 0; }
        .features-list li { font-size: 11px; color: #64748b; padding: 2px 0; display: flex; align-items: center; gap: 6px; }
        .features-list li i { color: #10b981; font-size: 10px; }
        .btn-contract { width: 100%; padding: 10px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-contract:active { transform: scale(0.98); }

        .history-item { background: white; border-radius: 10px; padding: 12px; margin-bottom: 8px; border: 1px solid #e2e8f0; }
        .history-item-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 6px; }
        .history-product-name { font-weight: 600; font-size: 13px; color: #1e293b; }
        .history-detail { font-size: 11px; color: #64748b; margin-bottom: 3px; }
        .history-amount { font-weight: 700; color: #dc2626; font-size: 13px; }

        .status-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 12px; font-size: 10px; font-weight: 700; }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-confirmed { background: #d1fae5; color: #065f46; }
        .status-cancelled { background: #fee2e2; color: #991b1b; }
        .status-no-coverage { background: #e5e7eb; color: #374151; }

        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.55); z-index: 100; display: flex; align-items: flex-end; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.25s; }
        .modal.active { opacity: 1; visibility: visible; }
        .modal-content { background: white; width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; padding: 18px; transform: translateY(24px); transition: all 0.3s; max-height: 92vh; overflow-y: auto; position: relative; }
        .modal.active .modal-content { transform: translateY(0); }
        @media (min-width: 560px) { .modal { align-items: center; } .modal-content { border-radius: 18px; } }

        .btn-primary { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; padding: 12px 16px; border-radius: 12px; font-weight: 700; transition: all 0.3s; display: flex; align-items: center; justify-content: center; border: none; font-size: 14.5px; width: 100%; cursor: pointer; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(37,99,235,0.25); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .loading-spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 1s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .input-field { width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 14px; margin-bottom: 12px; background: white; font-family: 'Inter', sans-serif; }
        .input-field:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

        .upload-area { border: 2px dashed #cbd5e1; border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; background: #f8fafc; margin-bottom: 12px; transition: all 0.2s; }
        .upload-area:active { border-color: var(--primary); background: #eff6ff; }
        .upload-area.has-photo { border-color: #10b981; background: #f0fdf4; }
        .upload-area img { max-width: 100%; max-height: 180px; border-radius: 8px; margin-top: 8px; }

        .step-indicator { display: flex; align-items: center; gap: 6px; margin-bottom: 16px; }
        .step-dot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: #e2e8f0; color: #94a3b8; flex-shrink: 0; }
        .step-dot.active { background: var(--primary); color: white; }
        .step-dot.done { background: #10b981; color: white; }
        .step-line { flex: 1; height: 2px; background: #e2e8f0; }
        .step-line.done { background: var(--primary); }

        .no-history { text-align: center; padding: 30px; color: #94a3b8; }

        #location-map { width: 100%; height: 260px; border-radius: 12px; overflow: hidden; margin-bottom: 10px; border: 1px solid #e2e8f0; z-index: 1; }
    </style>
</head>
<body>

    <div class="mobile-header">
        <div class="mobile-header-title">PLAN <span>HOGAR</span></div>
        <div class="balance-bubble" id="balance-bubble" onclick="toggleBalanceDetail()">
            <i class="fas fa-wallet"></i>
            <div class="bubble-amount" id="bubble-amount">Carg...</div>
            <div class="bubble-label">Saldo</div>
        </div>
    </div>

    <div class="tabs-container">
        <button class="tab-btn active" data-tab="plans"><i class="fas fa-box mr-1"></i> Paquetes</button>
        <button class="tab-btn" data-tab="history"><i class="fas fa-history mr-1"></i> Historial</button>
    </div>

    <div id="plans-section">
        <!-- CATEGORÍAS -->
        <div class="categories-scroll" id="categories-scroll">
            <div class="category-chip active" data-category="all">
                <i class="fas fa-th-large"></i> Todas
            </div>
            <!-- se llenan dinámicamente -->
        </div>

        <div class="products-container">
            <div class="products-grid" id="plans-list"></div>
        </div>
        <div id="no-plans" class="hidden text-center py-10 px-4">
            <i class="fas fa-box-open text-3xl text-gray-300 mb-3"></i>
            <p class="text-gray-500 font-medium text-sm">No hay planes disponibles</p>
        </div>
    </div>

    <div id="history-section" class="hidden px-3 py-3">
        <div id="history-list"></div>
        <div id="no-history" class="no-history hidden">
            <i class="fas fa-receipt text-3xl mb-3"></i>
            <p class="font-medium text-sm">Sin solicitudes aún</p>
            <p class="text-xs mt-1">Tus solicitudes aparecerán aquí</p>
        </div>
    </div>

    <div id="balance-modal" class="modal">
        <div class="modal-content text-center">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-lg font-semibold text-gray-800">Tu Saldo</h3>
                <button id="close-balance-modal" class="text-gray-400 hover:text-gray-500"><i class="fas fa-times"></i></button>
            </div>
            <div style="width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #2563eb, #1d4ed8); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
                <i class="fas fa-wallet text-2xl text-white"></i>
            </div>
            <p class="text-sm text-gray-500 mb-1">Saldo disponible</p>
            <p id="detail-balance" class="text-3xl font-extrabold mb-4" style="color: var(--primary);"></p>
            <button id="close-balance-btn" class="btn-primary"><i class="fas fa-check mr-2"></i> Cerrar</button>
        </div>
    </div>

    <div id="contract-modal" class="modal">
        <div class="modal-content" id="contract-modal-content"></div>
    </div>

    <div id="confirmation-modal" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-lg font-semibold text-gray-800">Confirmar solicitud</h3>
                <button id="close-confirmation-modal" class="text-gray-400 hover:text-gray-500"><i class="fas fa-times"></i></button>
            </div>
            <div class="mb-3"><p id="confirmation-text" class="text-gray-600 text-sm"></p></div>
            <div class="flex space-x-2">
                <button id="cancel-request" class="flex-1 py-2 px-3 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-800 transition-colors font-medium text-sm">Cancelar</button>
                <button id="confirm-request" class="flex-1 py-2 px-3 rounded-lg text-white transition-colors font-medium flex items-center justify-center text-sm" style="background:var(--primary)">
                    <span id="confirm-request-text">Enviar solicitud</span>
                    <div id="confirm-request-spinner" class="loading-spinner ml-2 hidden"></div>
                </button>
            </div>
        </div>
    </div>

    <div id="result-modal" class="modal">
        <div class="modal-content">
            <div class="flex justify-center mb-3">
                <div id="result-icon" class="w-14 h-14 rounded-full flex items-center justify-center text-2xl">
                    <i class="fas fa-check-circle text-green-500"></i>
                </div>
            </div>
            <div class="text-center mb-4">
                <h3 id="result-title" class="text-lg font-semibold text-gray-800 mb-1">¡Solicitud enviada!</h3>
                <p id="result-message" class="text-gray-600 text-sm">Tu solicitud se ha enviado correctamente.</p>
            </div>
            <button id="close-result-modal" class="w-full py-2 px-3 rounded-lg text-white transition-colors font-medium text-sm" style="background:var(--primary)">Aceptar</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const supabaseUrl = 'https://aleadadisazocjovibeh.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsZWFkYWRpc2F6b2Nqb3ZpYmVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0NDE5NjMsImV4cCI6MjA3NTAxNzk2M30.z82tP0C-UiiNuzP_jqrQf4LBusFqrDi1WYbdnuTh47E';
        window.supabase = supabase.createClient(supabaseUrl, supabaseKey);

        const TELEGRAM_BOT_TOKEN = '7596286871:AAGFe3sHy-GhykyM_xsFwDU8qrt6SWXSWHY';
        const TELEGRAM_CHAT_ID = '-5155315945';

        let currentUser = null;
        let userProfile = null;
        let currentBalance = 0;
        let currentPlan = null;
        let currentStep = 1;
        let currentTab = 'plans';
        let contractMap = null;
        let contractMapMarker = null;

        // Categorías
        let allCategories = [];
        let allPlans = [];
        let selectedCategory = 'all';

        let formData = {
            fullName: '', idNumber: '', phonePrimary: '', phoneReference: '', phoneBeneficiary: '',
            installationAddress: '', city: '', zone: '',
            idFrontPhoto: null, idBackPhoto: null, selfiePhoto: null,
            location: null
        };

        const formatCurrency = (amount) => 'Bs ' + parseFloat(amount).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");

        const showToast = (msg, type = 'success') => {
            const t = document.createElement('div');
            t.className = `fixed top-4 right-4 px-4 py-2 rounded-md shadow-lg z-50 ${type === 'success' ? 'bg-green-600' : 'bg-red-600'} text-white font-medium text-sm`;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        };

        const openModal = (id) => { document.getElementById(id).classList.add('active'); document.body.style.overflow = 'hidden'; };
        const closeModal = (id) => { document.getElementById(id).classList.remove('active'); document.body.style.overflow = ''; };

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
            document.getElementById('plans-section').classList.toggle('hidden', tab !== 'plans');
            document.getElementById('history-section').classList.toggle('hidden', tab !== 'history');
            if (tab === 'history') loadHistory();
        }

        async function calculateBalance() {
            const { data, error } = await supabase.from('transactions').select('amount, type').eq('user_id', currentUser.id).eq('status', 'completed');
            if (error) { console.error(error); return 0; }
            let bal = 0;
            (data || []).forEach(t => { bal += (t.type === 'deposit' ? t.amount : -t.amount); });
            return bal;
        }

        function updateBalanceDisplay() {
            const f = formatCurrency(currentBalance);
            const parts = f.split('.');
            document.getElementById('bubble-amount').innerHTML = parts[0] + '.<small style="font-size:7px">' + (parts[1] || '00') + '</small>';
            document.getElementById('detail-balance').textContent = f;
        }

        function toggleBalanceDetail() { updateBalanceDisplay(); openModal('balance-modal'); }

        // ---------- CARGAR CATEGORÍAS + PLANES ----------
        async function loadPlans() {
            // 1) Categorías activas
            const { data: cats, error: catErr } = await supabase
                .from('package_categories')
                .select('*')
                .eq('is_active', true)
                .order('display_order', { ascending: true });
            if (catErr) { console.error(catErr); }
            allCategories = cats || [];

            // 2) Planes activos
            const { data, error } = await supabase.from('internet_packages').select('*').eq('is_active', true)
                .order('is_featured', { ascending: false }).order('price', { ascending: true });
            if (error) { showToast('Error al cargar planes', 'error'); return; }
            allPlans = data || [];

            renderCategories();
            applyCategoryFilter();
        }

        function renderCategories() {
            const wrap = document.getElementById('categories-scroll');
            const html = [`<div class="category-chip active" data-category="all"><i class="fas fa-th-large"></i> Todas</div>`];
            allCategories.forEach(cat => {
                html.push(`
                    <div class="category-chip" data-category="${cat.id}">
                        <i class="fas ${cat.icon || 'fa-tag'}"></i> ${cat.name}
                    </div>`);
            });
            wrap.innerHTML = html.join('');

            wrap.querySelectorAll('.category-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    wrap.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    selectedCategory = chip.dataset.category;
                    applyCategoryFilter();
                });
            });
        }

        function applyCategoryFilter() {
            const filtered = selectedCategory === 'all'
                ? allPlans
                : allPlans.filter(p => p.category_id === selectedCategory);
            renderPlans(filtered);
        }

        function renderPlans(plans) {
            const list = document.getElementById('plans-list');
            const noPlans = document.getElementById('no-plans');
            if (!plans.length) { list.innerHTML = ''; noPlans.classList.remove('hidden'); return; }
            noPlans.classList.add('hidden');

            list.innerHTML = plans.map(plan => {
                const finalPrice = plan.discount_percentage > 0 ? plan.price * (1 - plan.discount_percentage / 100) : plan.price;
                const totalFirstPayment = finalPrice + (plan.installation_fee || 0);
                const hasDiscount = plan.discount_percentage > 0;
                return `
                    <div class="product-card" data-plan-id="${plan.id}">
                        ${plan.is_featured && !hasDiscount ? '<span class="badge-featured">★ Destacado</span>' : ''}
                        ${hasDiscount ? `<span class="badge-discount">-${plan.discount_percentage}%</span>` : ''}
                        ${plan.image_url ? `<img src="${plan.image_url}" class="plan-image" alt="${plan.name}">` : ''}
                        <div class="plan-speed-display">${plan.speed_mbps} <span>Mbps</span></div>
                        <div class="product-name">${plan.name}</div>
                        <div class="product-description">${plan.description || ''}</div>
                        <div class="price-row">
                            <span class="product-price">${formatCurrency(finalPrice)}</span>
                            <span style="font-size: 12px; color: #64748b;">/mes</span>
                            ${hasDiscount ? `<span class="product-price-old">${formatCurrency(plan.price)}</span>` : ''}
                        </div>
                        ${plan.installation_fee > 0 ? `<p style="font-size: 12px; color: #d97706; font-weight: 600; margin-bottom: 8px;">+ Instalación: ${formatCurrency(plan.installation_fee)}</p>` : `<p style="font-size: 12px; color: #059669; font-weight: 600; margin-bottom: 8px;">¡Instalación GRATIS!</p>`}
                        <p style="font-size: 11px; color: #64748b; margin-bottom: 8px;">Primer pago: <strong>${formatCurrency(totalFirstPayment)}</strong></p>
                        ${plan.features && plan.features.length ? `<ul class="features-list">${plan.features.map(f => `<li><i class="fas fa-check-circle"></i> ${f}</li>`).join('')}</ul>` : ''}
                        <button class="btn-contract" onclick="event.stopPropagation(); startContract('${plan.id}')">
                            <i class="fas fa-wifi"></i> Contratar Plan
                        </button>
                    </div>`;
            }).join('');

            document.querySelectorAll('.product-card').forEach(card => {
                card.addEventListener('click', () => startContract(card.dataset.planId));
            });
        }

        async function startContract(planId) {
            const { data: plan } = await supabase.from('internet_packages').select('*').eq('id', planId).single();
            if (!plan) { showToast('Plan no encontrado', 'error'); return; }

            currentBalance = await calculateBalance();
            const finalPrice = plan.discount_percentage > 0 ? plan.price * (1 - plan.discount_percentage / 100) : plan.price;
            const totalFirstPayment = finalPrice + (plan.installation_fee || 0);
            if (currentBalance < totalFirstPayment) { showToast(`Saldo insuficiente. Necesitas ${formatCurrency(totalFirstPayment)}`, 'error'); return; }

            currentPlan = plan;
            currentStep = 1;
            formData = {
                fullName: userProfile?.full_name || '', idNumber: '',
                phonePrimary: userProfile?.phone || '', phoneReference: '', phoneBeneficiary: '',
                installationAddress: '', city: '', zone: '',
                idFrontPhoto: null, idBackPhoto: null, selfiePhoto: null,
                location: null
            };

            openModal('contract-modal');
            renderContractStep();
        }

        function renderContractStep() {
            const container = document.getElementById('contract-modal-content');
            const stepsHTML = `
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-lg font-semibold text-gray-800">${currentPlan.name}</h3>
                    <button onclick="closeModal('contract-modal')" class="text-gray-400 hover:text-gray-500"><i class="fas fa-times"></i></button>
                </div>
                <div class="step-indicator">
                    <div class="step-dot ${currentStep >= 1 ? 'active' : ''} ${currentStep > 1 ? 'done' : ''}">${currentStep > 1 ? '<i class="fas fa-check"></i>' : '1'}</div>
                    <div class="step-line ${currentStep > 1 ? 'done' : ''}"></div>
                    <div class="step-dot ${currentStep >= 2 ? 'active' : ''} ${currentStep > 2 ? 'done' : ''}">${currentStep > 2 ? '<i class="fas fa-check"></i>' : '2'}</div>
                    <div class="step-line ${currentStep > 2 ? 'done' : ''}"></div>
                    <div class="step-dot ${currentStep >= 3 ? 'active' : ''}">3</div>
                </div>`;

            let contentHTML = '';
            if (currentStep === 1) contentHTML = renderLocationStep();
            else if (currentStep === 2) contentHTML = renderDocumentsStep();
            else contentHTML = renderDataStep();

            container.innerHTML = stepsHTML + contentHTML;

            if (currentStep === 1) setTimeout(() => initLocationMap(), 120);
            setTimeout(() => updateNextButton(), 100);
        }

        function renderLocationStep() {
            return `
                <div class="text-center py-2">
                    <h4 class="font-bold text-base mb-1"><i class="fas fa-map-marker-alt" style="color: var(--primary);"></i> Ubicación de instalación</h4>
                    <p class="text-gray-600 text-xs mb-3">Confirma tu ubicación actual o toca el mapa / arrastra el marcador para elegir otra</p>
                    <div id="location-map"></div>
                    <p id="location-status" style="font-size: 12px; color: #64748b; margin-bottom: 14px; min-height: 16px;">Obteniendo tu ubicación actual...</p>
                    <div class="flex gap-3 mt-2">
                        <button onclick="closeModal('contract-modal')" style="flex: 1; padding: 10px; background: #f1f5f9; border: none; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer;">Cancelar</button>
                        <button onclick="currentStep=2; renderContractStep();" style="flex: 1; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer;" id="step1-next" disabled>
                            <i class="fas fa-check mr-1"></i> Confirmar ubicación
                        </button>
                    </div>
                </div>`;
        }

        function initLocationMap() {
            const mapEl = document.getElementById('location-map');
            if (!mapEl || typeof L === 'undefined') return;
            if (contractMap) { contractMap.remove(); contractMap = null; contractMapMarker = null; }

            const defaultCenter = [-16.5, -68.15];
            contractMap = L.map('location-map').setView(defaultCenter, 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(contractMap);

            const statusEl = document.getElementById('location-status');

            function placeMarker(lat, lng, isManual) {
                formData.location = { lat, lng };
                if (contractMapMarker) contractMapMarker.setLatLng([lat, lng]);
                else {
                    contractMapMarker = L.marker([lat, lng], { draggable: true }).addTo(contractMap);
                    contractMapMarker.on('dragend', () => {
                        const p = contractMapMarker.getLatLng();
                        formData.location = { lat: p.lat, lng: p.lng };
                        if (statusEl) statusEl.textContent = '📍 Ubicación marcada manualmente';
                        updateNextButton();
                    });
                }
                contractMap.setView([lat, lng], 16);
                if (statusEl) statusEl.textContent = isManual ? '📍 Ubicación marcada manualmente' : '✅ Esta es tu ubicación actual. Puedes arrastrarla o tocar el mapa.';
                updateNextButton();
            }

            contractMap.on('click', (e) => placeMarker(e.latlng.lat, e.latlng.lng, true));

            if (formData.location) placeMarker(formData.location.lat, formData.location.lng, true);
            else if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => placeMarker(pos.coords.latitude, pos.coords.longitude, false),
                    () => { if (statusEl) statusEl.textContent = 'No se pudo obtener tu ubicación. Toca el mapa.'; },
                    { enableHighAccuracy: true, timeout: 8000 }
                );
            } else if (statusEl) statusEl.textContent = 'Geolocalización no disponible. Toca el mapa.';

            setTimeout(() => contractMap.invalidateSize(), 200);
        }

        function renderDocumentsStep() {
            return `
                <div>
                    <h4 class="font-bold text-base mb-3">📸 Documentación Requerida</h4>
                    <p class="text-xs text-gray-600 mb-3">Sube fotos de tu carnet y una selfie</p>

                    <div class="mb-3">
                        <label style="font-size: 12px; font-weight: 600; color: #475569; display: block; margin-bottom: 4px;">ANVERSO del Carnet</label>
                        <div class="upload-area ${formData.idFrontPhoto ? 'has-photo' : ''}" onclick="document.getElementById('id-front-input').click()">
                            ${formData.idFrontPhoto ? `<img src="${formData.idFrontPhoto}">` : '<i class="fas fa-id-card text-2xl text-gray-400"></i><p style="font-size: 12px; font-weight: 600; color: #64748b;">Tocar para subir foto</p><p style="font-size: 10px; color: #94a3b8;">Galería o cámara</p>'}
                        </div>
                        <input type="file" id="id-front-input" accept="image/*" style="display: none;" onchange="handlePhoto(event, 'idFrontPhoto')">
                    </div>

                    <div class="mb-3">
                        <label style="font-size: 12px; font-weight: 600; color: #475569; display: block; margin-bottom: 4px;">REVERSO del Carnet</label>
                        <div class="upload-area ${formData.idBackPhoto ? 'has-photo' : ''}" onclick="document.getElementById('id-back-input').click()">
                            ${formData.idBackPhoto ? `<img src="${formData.idBackPhoto}">` : '<i class="fas fa-id-card text-2xl text-gray-400"></i><p style="font-size: 12px; font-weight: 600; color: #64748b;">Tocar para subir foto</p><p style="font-size: 10px; color: #94a3b8;">Galería o cámara</p>'}
                        </div>
                        <input type="file" id="id-back-input" accept="image/*" style="display: none;" onchange="handlePhoto(event, 'idBackPhoto')">
                    </div>

                    <div class="mb-3">
                        <label style="font-size: 12px; font-weight: 600; color: #475569; display: block; margin-bottom: 4px;">Selfie SOSTENIENDO tu Carnet</label>
                        <div class="upload-area ${formData.selfiePhoto ? 'has-photo' : ''}" onclick="document.getElementById('selfie-input').click()">
                            ${formData.selfiePhoto ? `<img src="${formData.selfiePhoto}">` : '<i class="fas fa-camera text-2xl text-gray-400"></i><p style="font-size: 12px; font-weight: 600; color: #64748b;">Tocar para selfie</p><p style="font-size: 10px; color: #94a3b8;">Galería o cámara frontal</p>'}
                        </div>
                        <input type="file" id="selfie-input" accept="image/*" style="display: none;" onchange="handlePhoto(event, 'selfiePhoto')">
                    </div>

                    <div class="flex gap-3 mt-5">
                        <button onclick="currentStep=1; renderContractStep();" style="flex: 1; padding: 10px; background: #f1f5f9; border: none; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer;"><i class="fas fa-arrow-left mr-1"></i> Atrás</button>
                        <button onclick="currentStep=3; renderContractStep();" style="flex: 1; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer;" id="step2-next" disabled>Siguiente <i class="fas fa-arrow-right ml-1"></i></button>
                    </div>
                </div>`;
        }

        function renderDataStep() {
            const finalPrice = currentPlan.discount_percentage > 0 ? currentPlan.price * (1 - currentPlan.discount_percentage / 100) : currentPlan.price;
            const totalFirstPayment = finalPrice + (currentPlan.installation_fee || 0);

            return `
                <div>
                    <h4 class="font-bold text-base mb-3">📝 Datos del Cliente</h4>

                    <div style="margin-bottom: 10px;">
                        <label style="font-size: 11px; font-weight: 600; color: #475569; display: block; margin-bottom: 3px;">Nombre Completo *</label>
                        <input type="text" class="input-field" placeholder="Ej: Juan Pérez Mamani" value="${formData.fullName}" oninput="formData.fullName = this.value; updateNextButton();" style="margin-bottom: 0;">
                    </div>

                    <div style="margin-bottom: 10px;">
                        <label style="font-size: 11px; font-weight: 600; color: #475569; display: block; margin-bottom: 3px;">Número de Carnet *</label>
                        <input type="text" class="input-field" placeholder="Ej: 12345678 LP" value="${formData.idNumber}" oninput="formData.idNumber = this.value; updateNextButton();" style="margin-bottom: 0;">
                    </div>

                    <div style="margin-bottom: 10px;">
                        <label style="font-size: 11px; font-weight: 600; color: #475569; display: block; margin-bottom: 3px;">Número Principal *</label>
                        <input type="tel" class="input-field" placeholder="Ej: 71234567" value="${formData.phonePrimary}" oninput="formData.phonePrimary = this.value; updateNextButton();" style="margin-bottom: 0;">
                    </div>

                    <div style="margin-bottom: 10px;">
                        <label style="font-size: 11px; font-weight: 600; color: #475569; display: block; margin-bottom: 3px;">Número de Referencia</label>
                        <input type="tel" class="input-field" placeholder="Otro número de contacto" value="${formData.phoneReference}" oninput="formData.phoneReference = this.value;" style="margin-bottom: 0;">
                    </div>

                    <div style="margin-bottom: 10px;">
                        <label style="font-size: 11px; font-weight: 600; color: #475569; display: block; margin-bottom: 3px;">Número de Beneficiario *</label>
                        <input type="tel" class="input-field" placeholder="Número de quien recibirá el servicio" value="${formData.phoneBeneficiary}" oninput="formData.phoneBeneficiary = this.value; updateNextButton();" style="margin-bottom: 0;">
                    </div>

                    <div style="margin-bottom: 10px;">
                        <label style="font-size: 11px; font-weight: 600; color: #475569; display: block; margin-bottom: 3px;">Dirección de Instalación *</label>
                        <textarea class="input-field" rows="2" placeholder="Av. Siempre Viva #742, Zona Central" oninput="formData.installationAddress = this.value; updateNextButton();" style="margin-bottom: 0;">${formData.installationAddress}</textarea>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px;">
                        <div>
                            <label style="font-size: 11px; font-weight: 600; color: #475569; display: block; margin-bottom: 3px;">Ciudad *</label>
                            <input type="text" class="input-field" placeholder="Ej: La Paz" value="${formData.city}" oninput="formData.city = this.value; updateNextButton();" style="margin-bottom: 0;">
                        </div>
                        <div>
                            <label style="font-size: 11px; font-weight: 600; color: #475569; display: block; margin-bottom: 3px;">Zona/Barrio</label>
                            <input type="text" class="input-field" placeholder="Ej: Miraflores" value="${formData.zone}" oninput="formData.zone = this.value;" style="margin-bottom: 0;">
                        </div>
                    </div>

                    <div style="background: #f8fafc; border-radius: 10px; padding: 12px; margin-bottom: 12px;">
                        <p style="font-size: 12px; font-weight: 700; color: #1e40af; margin-bottom: 4px;">📦 ${currentPlan.name}</p>
                        <p style="font-size: 11px; color: #64748b;">Velocidad: ${currentPlan.speed_mbps} Mbps</p>
                        <p style="font-size: 11px; color: #64748b;">Precio mensual: ${formatCurrency(finalPrice)}</p>
                        <p style="font-size: 11px; font-weight: 600; color: #1e293b;">Primer pago: ${formatCurrency(totalFirstPayment)}</p>
                        ${formData.location ? `<p style="font-size: 11px; color: #64748b; margin-top: 4px;">📍 Ubicación: ${formData.location.lat.toFixed(6)}, ${formData.location.lng.toFixed(6)}</p>` : ''}
                    </div>

                    <div class="flex gap-3 mt-5">
                        <button onclick="currentStep=2; renderContractStep();" style="flex: 1; padding: 10px; background: #f1f5f9; border: none; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer;"><i class="fas fa-arrow-left mr-1"></i> Atrás</button>
                        <button onclick="confirmSubmit()" style="flex: 1; padding: 10px; background: #059669; color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer;" id="step3-next" disabled><i class="fas fa-paper-plane mr-1"></i> Enviar Solicitud</button>
                    </div>
                </div>`;
        }

        function handlePhoto(event, fieldName) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                formData[fieldName] = e.target.result;
                renderContractStep();
                updateNextButton();
            };
            reader.readAsDataURL(file);
        }

        function updateNextButton() {
            setTimeout(() => {
                let id = '', valid = false;
                if (currentStep === 1) { valid = !!formData.location; id = 'step1-next'; }
                else if (currentStep === 2) { valid = formData.idFrontPhoto && formData.idBackPhoto && formData.selfiePhoto; id = 'step2-next'; }
                else if (currentStep === 3) { valid = formData.fullName && formData.idNumber && formData.phonePrimary && formData.phoneBeneficiary && formData.installationAddress && formData.city; id = 'step3-next'; }
                const btn = document.getElementById(id);
                if (btn) btn.disabled = !valid;
            }, 100);
        }

        function confirmSubmit() {
            const finalPrice = currentPlan.discount_percentage > 0 ? currentPlan.price * (1 - currentPlan.discount_percentage / 100) : currentPlan.price;
            const totalFirstPayment = finalPrice + (currentPlan.installation_fee || 0);
            const locationText = formData.location ? `${formData.location.lat.toFixed(6)}, ${formData.location.lng.toFixed(6)}` : 'No especificada';

            document.getElementById('confirmation-text').innerHTML = `
                <div style="background: #f8fafc; padding: 10px; border-radius: 8px; margin-bottom: 8px;">
                    <strong>${currentPlan.name}</strong><br>
                    <span style="font-size: 12px;">Velocidad: ${currentPlan.speed_mbps} Mbps</span><br>
                    <span style="font-size: 12px;">Primer pago: <strong style="color: var(--primary);">${formatCurrency(totalFirstPayment)}</strong></span>
                </div>
                <div style="font-size: 12px;">
                    <p><strong>Nombre:</strong> ${formData.fullName}</p>
                    <p><strong>CI:</strong> ${formData.idNumber}</p>
                    <p><strong>N° Principal:</strong> ${formData.phonePrimary}</p>
                    <p><strong>N° Referencia:</strong> ${formData.phoneReference || '-'}</p>
                    <p><strong>N° Beneficiario:</strong> ${formData.phoneBeneficiary}</p>
                    <p><strong>Dirección:</strong> ${formData.installationAddress}</p>
                    <p><strong>Ciudad:</strong> ${formData.city}${formData.zone ? ' - ' + formData.zone : ''}</p>
                    <p><strong>Ubicación (mapa):</strong> ${locationText}</p>
                </div>
                <p style="font-size: 11px; color: #dc2626; margin-top: 8px;"><i class="fas fa-info-circle mr-1"></i>Se descontará ${formatCurrency(totalFirstPayment)} de tu saldo.</p>
            `;

            closeModal('contract-modal');
            openModal('confirmation-modal');
        }

        async function submitRequest() {
            const confirmBtn = document.getElementById('confirm-request');
            const confirmText = document.getElementById('confirm-request-text');
            const confirmSpinner = document.getElementById('confirm-request-spinner');

            confirmBtn.disabled = true;
            confirmText.textContent = 'Enviando...';
            confirmSpinner.classList.remove('hidden');

            try {
                const finalPrice = currentPlan.discount_percentage > 0 ? currentPlan.price * (1 - currentPlan.discount_percentage / 100) : currentPlan.price;
                const totalFirstPayment = finalPrice + (currentPlan.installation_fee || 0);

                currentBalance = await calculateBalance();
                if (currentBalance < totalFirstPayment) throw new Error('Saldo insuficiente');

                const { data: request, error } = await supabase
                    .from('request_status')
                    .insert([{
                        user_id: currentUser.id,
                        package_id: currentPlan.id,
                        package_name: currentPlan.name,
                        monthly_price: finalPrice,
                        installation_fee: currentPlan.installation_fee || 0,
                        total_first_payment: totalFirstPayment,
                        status: 'pending',
                        status_message: 'Solicitud en revisión'
                    }])
                    .select()
                    .single();
                if (error) throw error;

                const { error: txError } = await supabase
                    .from('transactions')
                    .insert([{
                        user_id: currentUser.id,
                        amount: totalFirstPayment,
                        type: 'withdrawal',
                        description: `Contratación ${currentPlan.name} - Solicitud #${request.id.slice(0, 8)}`,
                        status: 'completed',
                        metadata: { request_id: request.id, package_id: currentPlan.id, package_name: currentPlan.name, speed_mbps: currentPlan.speed_mbps }
                    }]);
                if (txError) throw txError;

                const mapLink = (formData.location)
                    ? `https://www.openstreetmap.org/?mlat=${formData.location.lat}&mlon=${formData.location.lng}#map=17/${formData.location.lat}/${formData.location.lng}`
                    : 'No especificada';

                const telegramMessage = `
🔔 <b>NUEVA SOLICITUD DE INTERNET</b>

📦 <b>PLAN:</b> ${currentPlan.name}
⚡ Velocidad: ${currentPlan.speed_mbps} Mbps
💰 Precio: ${formatCurrency(finalPrice)}/mes
💵 Primer pago: ${formatCurrency(totalFirstPayment)}

👤 <b>CLIENTE</b>
Nombre: ${formData.fullName}
CI: ${formData.idNumber}
📧 Email: ${userProfile?.email || currentUser.email || 'No'}

📞 <b>CONTACTOS</b>
Principal: ${formData.phonePrimary}
Referencia: ${formData.phoneReference || 'No'}
Beneficiario: ${formData.phoneBeneficiary}

📍 <b>DIRECCIÓN</b>
${formData.installationAddress}
${formData.city}${formData.zone ? ', ' + formData.zone : ''}
🗺️ Coordenadas: ${formData.location ? formData.location.lat.toFixed(6) + ', ' + formData.location.lng.toFixed(6) : 'No'}
<a href="${mapLink}">Ver en el mapa</a>

📄 <b>ESTADO:</b> Pendiente de revisión
🆔 ID: ${request.id.slice(0, 8)}
⏰ ${new Date().toLocaleString('es-BO')}`;

                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: telegramMessage, parse_mode: 'HTML' })
                });

                if (formData.idFrontPhoto) await sendPhotoToTelegram(formData.idFrontPhoto, `📸 ANVERSO CI - ${formData.fullName}`);
                if (formData.idBackPhoto) await sendPhotoToTelegram(formData.idBackPhoto, `📸 REVERSO CI - ${formData.fullName}`);
                if (formData.selfiePhoto) await sendPhotoToTelegram(formData.selfiePhoto, `🤳 SELFIE CON CI - ${formData.fullName}`);

                if (formData.location) {
                    await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendLocation`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, latitude: formData.location.lat, longitude: formData.location.lng })
                    });
                }

                currentBalance -= totalFirstPayment;
                updateBalanceDisplay();

                document.getElementById('result-title').textContent = '¡Solicitud enviada!';
                document.getElementById('result-message').innerHTML = `
                    Tu solicitud <strong>#${request.id.slice(0, 8)}</strong> ha sido enviada.<br>
                    <span class="status-badge status-pending" style="display: inline-flex; margin-top: 8px;">⏳ Pendiente</span><br>
                    <small style="color: #64748b; display: block; margin-top: 8px;">Te contactaremos al ${formData.phonePrimary}</small>`;
                document.getElementById('result-icon').innerHTML = '<i class="fas fa-check-circle text-green-500"></i>';

                closeModal('confirmation-modal');
                openModal('result-modal');

            } catch (error) {
                console.error(error);
                document.getElementById('result-title').textContent = 'Error';
                document.getElementById('result-message').textContent = error.message || 'No se pudo enviar la solicitud.';
                document.getElementById('result-icon').innerHTML = '<i class="fas fa-times-circle text-red-500"></i>';
                closeModal('confirmation-modal');
                openModal('result-modal');
            } finally {
                confirmBtn.disabled = false;
                confirmText.textContent = 'Enviar solicitud';
                confirmSpinner.classList.add('hidden');
            }
        }

        async function sendPhotoToTelegram(base64Data, caption) {
            try {
                const response = await fetch(base64Data);
                const blob = await response.blob();
                const fd = new FormData();
                fd.append('chat_id', TELEGRAM_CHAT_ID);
                fd.append('photo', blob, 'documento.jpg');
                fd.append('caption', caption);
                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd });
            } catch (err) { console.error('Error photo:', err); }
        }

        async function loadHistory() {
            const { data: requests, error } = await supabase.from('request_status').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
            const list = document.getElementById('history-list');
            const noHistory = document.getElementById('no-history');

            if (error || !requests || !requests.length) { list.innerHTML = ''; noHistory.classList.remove('hidden'); return; }
            noHistory.classList.add('hidden');

            const statusMap = {
                'pending': { class: 'status-pending', label: '⏳ Pendiente' },
                'confirmed': { class: 'status-confirmed', label: '✅ Confirmado' },
                'cancelled': { class: 'status-cancelled', label: '❌ Cancelado' },
                'no_coverage': { class: 'status-no-coverage', label: '📡 Sin Cobertura' }
            };

            list.innerHTML = requests.map(req => {
                const st = statusMap[req.status] || statusMap['pending'];
                return `
                    <div class="history-item">
                        <div class="history-item-header">
                            <div class="history-product-name">${req.package_name || 'Paquete'}</div>
                            <span class="status-badge ${st.class}">${st.label}</span>
                        </div>
                        <div class="history-detail">${formatCurrency(req.monthly_price)}/mes</div>
                        <div class="history-detail">${new Date(req.created_at).toLocaleDateString('es-BO', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</div>
                        <div class="history-amount">Primer pago: ${formatCurrency(req.total_first_payment || 0)}</div>
                        ${req.status_message ? `<div style="background: #f1f5f9; padding: 8px; border-radius: 6px; margin-top: 6px; font-size: 11px; color: #475569;"><i class="fas fa-info-circle mr-1"></i>${req.status_message}</div>` : ''}
                        <div style="font-size: 10px; color: #94a3b8; margin-top: 4px;">ID: #${req.id.slice(0, 8)}</div>
                    </div>`;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }

            currentUser = session.user;
            const { data: profile } = await supabase.from('user_profiles').select('*').eq('id', currentUser.id).single();
            userProfile = profile || null;

            currentBalance = await calculateBalance();
            updateBalanceDisplay();

            await loadPlans();

            document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));
            document.getElementById('close-balance-modal').addEventListener('click', () => closeModal('balance-modal'));
            document.getElementById('close-balance-btn').addEventListener('click', () => closeModal('balance-modal'));
            document.getElementById('close-confirmation-modal').addEventListener('click', () => closeModal('confirmation-modal'));
            document.getElementById('cancel-request').addEventListener('click', () => closeModal('confirmation-modal'));
            document.getElementById('confirm-request').addEventListener('click', submitRequest);
            document.getElementById('close-result-modal').addEventListener('click', () => { closeModal('result-modal'); window.location.reload(); });
        });
    </script>
</body>
</html>
