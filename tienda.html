<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Tienda - TokTok</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap');
        
        :root {
            --primary: #6d28d9;
            --primary-dark: #5b21b6;
            --primary-light: #8b5cf6;
            --primary-soft: #ede9fe;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #f9fafb;
            color: #111827;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Modern Product Card */
        .product-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.25s ease;
            border: 1px solid #f0f0f0;
            cursor: pointer;
            position: relative;
        }
        
        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -12px rgba(0, 0, 0, 0.15);
            border-color: #e5e7eb;
        }
        
        .product-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: #f3f4f6;
            transition: transform 0.3s ease;
        }
        
        .product-card:hover .product-image {
            transform: scale(1.02);
        }
        
        .product-price {
            color: var(--primary);
            font-weight: 700;
            font-size: 1rem;
        }
        
        .stock-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            backdrop-filter: blur(4px);
            background: rgba(255,255,255,0.9);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        
        .stock-available { background: #d1fae5; color: #065f46; }
        .stock-low { background: #fed7aa; color: #9a3412; }
        .stock-out { background: #fee2e2; color: #991b1b; }
        
        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease;
        }
        
        .modal.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal-content {
            background: white;
            width: 90%;
            max-width: 420px;
            border-radius: 28px;
            padding: 20px;
            transform: translateY(20px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        
        .modal.active .modal-content {
            transform: translateY(0);
        }
        
        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            font-size: 0.9rem;
            width: 100%;
        }
        
        .btn-primary:not(:disabled):hover {
            transform: scale(0.98);
            box-shadow: 0 8px 20px rgba(109, 40, 217, 0.25);
        }
        
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Carrusel de imágenes */
        .carousel-container {
            position: relative;
            margin-bottom: 16px;
            border-radius: 20px;
            overflow: hidden;
            background: #f9fafb;
        }
        
        .carousel-slides {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        
        .carousel-slides::-webkit-scrollbar {
            display: none;
        }
        
        .carousel-slide {
            flex: 0 0 100%;
            scroll-snap-align: start;
        }
        
        .carousel-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            background: #ffffff;
        }
        
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(4px);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            color: var(--primary);
            transition: all 0.2s;
            z-index: 10;
        }
        
        .carousel-btn:hover {
            background: white;
            transform: translateY(-50%) scale(1.05);
        }
        
        .carousel-btn.prev { left: 12px; }
        .carousel-btn.next { right: 12px; }
        
        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
        }
        
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 10px;
            background: #cbd5e1;
            transition: all 0.2s;
        }
        
        .dot.active {
            width: 18px;
            background: var(--primary);
        }
        
        /* Delivery section modern */
        .delivery-section {
            background: #f9fafb;
            border-radius: 20px;
            padding: 16px;
            margin: 16px 0;
            border: 1px solid #f0f0f0;
        }
        
        .section-title {
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }
        
        .input-field {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            font-size: 0.85rem;
            background: white;
            transition: all 0.2s;
        }
        
        .input-field:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(109,40,217,0.1);
        }
        
        .time-selector {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 8px;
        }
        
        .time-option {
            padding: 10px;
            border: 1.5px solid #e5e7eb;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }
        
        .time-option.selected {
            border-color: var(--primary);
            background: var(--primary-soft);
            color: var(--primary-dark);
        }
        
        /* Balance card */
        .balance-card {
            background: linear-gradient(135deg, #6d28d9 0%, #4c1d95 100%);
            border-radius: 20px;
            padding: 14px 18px;
            margin: 12px 12px 16px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 20px rgba(109,40,217,0.2);
        }
        
        /* Filters */
        .category-filters {
            display: flex;
            gap: 10px;
            padding: 12px 16px;
            overflow-x: auto;
            background: white;
            border-bottom: 1px solid #f0f0f0;
            scrollbar-width: none;
        }
        
        .category-btn {
            padding: 8px 18px;
            border-radius: 40px;
            background: #f3f4f6;
            color: #4b5563;
            font-size: 0.8rem;
            font-weight: 500;
            white-space: nowrap;
            border: none;
            transition: all 0.2s;
        }
        
        .category-btn.active {
            background: var(--primary);
            color: white;
        }
        
        /* Products grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            gap: 12px;
            padding: 12px;
        }
        
        /* Mapa modal full */
        .map-modal .modal-content {
            max-width: 95%;
            width: 95%;
            padding: 0;
            overflow: hidden;
            border-radius: 28px;
        }
        
        .map-modal-body {
            height: 60vh;
            position: relative;
        }
        
        #fullscreen-map {
            width: 100%;
            height: 100%;
        }
        
        .map-footer-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 40px;
        }
        
        /* Utility */
        .product-name {
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .product-description {
            font-size: 0.7rem;
            color: #6b7280;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 8px;
        }
        
        .buy-btn {
            background: var(--primary);
            color: white;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            border: none;
        }
        
        .quantity-selector {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin: 16px 0;
        }
        
        .quantity-btn {
            width: 40px;
            height: 40px;
            border-radius: 40px;
            background: #f3f4f6;
            border: none;
            font-weight: bold;
        }
        
        /* Responsive */
        @media (max-width: 640px) {
            .products-grid {
                gap: 10px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>

<div class="mobile-only">
    <div class="flex items-center justify-between px-4 py-3 bg-white border-b sticky top-0 z-50">
        <div class="font-bold text-lg text-gray-800">TokTok Shop</div>
        <a href="dashboard.html" class="text-purple-600"><i class="fas fa-arrow-left text-lg"></i></a>
    </div>
    
    <div class="balance-card">
        <div>
            <div class="text-xs opacity-90">Saldo disponible</div>
            <div id="current-balance" class="text-xl font-bold">Bs 0</div>

    <div class="px-4 py-3 bg-white">

    </div>
    
    <div class="category-filters">
        <button class="category-btn active" data-category="all">Todos</button>
        <button class="category-btn" data-category="Electrónica">Electrónica</button>

</div>

<!-- Modal detalle producto con carrusel -->
<div id="product-detail-modal" class="modal">
    <div class="modal-content">

        <div class="flex justify-between items-center mb-3">

            <div><div class="text-xs text-gray-500">Precio</div><div id="product-detail-price" class="product-price text-base"></div></div>

        <div class="text-center mb-3">

        <div class="delivery-section">
            <div class="section-title"><i class="fas fa-truck text-purple-600"></i> Entrega</div>

            <div id="location-preview" class="hidden bg-white p-3 rounded-xl border mb-3 cursor-pointer">
                <div class="flex justify-between"><span class="font-semibold text-sm"><i class="fas fa-location-dot text-purple-600"></i> Ubicación</span><span class="text-purple-600 text-xs">Cambiar</span></div>
                <div id="location-preview-text" class="text-sm text-gray-700"></div>

            <input type="text" id="delivery-address-name" class="input-field mb-3" placeholder="Nombre del lugar *">
            <div class="time-selector mb-3">
                <div class="time-option" data-time="09:00-12:00"><span class="block font-medium">Mañana</span><span class="text-xs">9:00-12:00</span></div>
                <div class="time-option" data-time="12:00-15:00"><span class="block font-medium">Mediodía</span><span class="text-xs">12:00-15:00</span></div>
                <div class="time-option" data-time="15:00-18:00"><span class="block font-medium">Tarde</span><span class="text-xs">15:00-18:00</span></div>
                <div class="time-option" data-time="18:00-21:00"><span class="block font-medium">Noche</span><span class="text-xs">18:00-21:00</span></div>
            </div>
            <textarea id="delivery-notes" class="input-field" placeholder="Notas adicionales..." rows="2"></textarea>
        </div>
        
        <button id="buy-product-btn" class="btn-primary" disabled><i class="fas fa-shopping-cart"></i> Comprar ahora</button>
    </div>
</div>

<!-- Modal mapa -->
<div id="map-modal" class="modal map-modal">
    <div class="modal-content">
        <div class="p-4 border-b flex justify-between items-center">
            <h3 class="font-semibold">Selecciona punto de entrega</h3>
            <button id="close-map-modal" class="text-gray-500 text-2xl">&times;</button>
        </div>
        <div class="map-modal-body"><div id="fullscreen-map"></div></div>
        <div class="p-4"><button id="confirm-location-btn" class="map-footer-btn" disabled>Confirmar ubicación</button></div>

</div>

<!-- Modales adicionales -->
<div id="confirmation-modal" class="modal"><div class="modal-content"><h3 class="font-bold mb-2">Confirmar compra</h3><div id="confirmation-text" class="mb-4"></div><div class="flex gap-2"><button id="cancel-purchase" class="flex-1 p-2 rounded-xl bg-gray-100">Cancelar</button><button id="confirm-purchase" class="flex-1 p-2 rounded-xl bg-purple-600 text-white">Confirmar</button></div></div></div>
<div id="result-modal" class="modal"><div class="modal-content text-center"><i id="result-icon" class="fas fa-check-circle text-5xl text-green-500 mb-3"></i><h3 id="result-title" class="text-xl font-bold mb-1"></h3><p id="result-message" class="mb-4"></p><button id="close-result-modal" class="btn-primary">Aceptar</button></div></div>
<div id="invoice-modal" class="modal"><div class="modal-content"><div class="flex justify-between"><span class="font-bold">Comprobante</span><button id="close-invoice-modal">&times;</button></div><div id="invoice-content" class="my-3"></div><button id="download-invoice" class="btn-primary mb-2">Descargar imagen</button><button id="close-invoice" class="w-full p-2 rounded-xl bg-gray-100">Cerrar</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const supabaseUrl = 'https://aleadadisazocjovibeh.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsZWFkYWRpc2F6b2Nqb3ZpYmVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0NDE5NjMsImV4cCI6MjA3NTAxNzk2M30.z82tP0C-UiiNuzP_jqrQf4LBusFqrDi1WYbdnuTh47E';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);
    
    let currentUser = null, userProfile = null, currentBalance = 0, currentProduct = null, selectedQuantity = 1, selectedDeliveryTime = null;
    let products = [], currentCategory = 'all';
    let fullscreenMap = null, selectedLocationCoords = null, selectedLocationName = '', tempMarker = null;
    let currentImageIndex = 0, productImages = [];
    
    const TELEGRAM_BOT_TOKEN = '7596286871:AAGFe3sHy-GhykyM_xsFwDU8qrt6SWXSWHY';
    const TELEGRAM_CHAT_ID = '-5155315945';
    
    const formatCurrency = (amount) => 'Bs ' + parseFloat(amount).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    const showToast = (msg, type='success') => { alert(msg); }; // simple
    
    function generateGoogleMapsLink(lat,lng,label){ return `https://www.google.com/maps?q=${lat},${lng}&label=${encodeURIComponent(label)}`; }
    
    async function sendTelegramMessage(msg){
        try{
            const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:TELEGRAM_CHAT_ID,text:msg,parse_mode:'HTML'})});
            return res.ok;
        }catch(e){ return false; }
    }
    
    function openModal(id){ document.getElementById(id).classList.add('active'); document.body.style.overflow='hidden'; }
    function closeModal(id){ document.getElementById(id).classList.remove('active'); document.body.style.overflow=''; }
    
    // Carrusel
    function renderCarousel(images){
        const slidesDiv = document.getElementById('carousel-slides');
        const dotsDiv = document.getElementById('carousel-dots');
        if(!images.length) images = ['https://via.placeholder.com/400/f3f4f6/9ca3af?text=Sin+imagen'];
        slidesDiv.innerHTML = '';
        dotsDiv.innerHTML = '';
        images.forEach((img,idx)=>{
            const slide = document.createElement('div'); slide.className = 'carousel-slide';
            const imgEl = document.createElement('img'); imgEl.src = img; imgEl.className = 'carousel-image'; imgEl.onerror = (e)=> e.target.src='https://via.placeholder.com/400/f3f4f6/9ca3af?text=Error';
            slide.appendChild(imgEl); slidesDiv.appendChild(slide);
            const dot = document.createElement('div'); dot.className = 'dot'; dot.dataset.index = idx; dot.addEventListener('click',()=>scrollToImage(idx));
            dotsDiv.appendChild(dot);
        });
        const container = document.querySelector('.carousel-slides');
        const updateDots = () => {
            const scrollLeft = container.scrollLeft, slideWidth = container.clientWidth;
            const index = Math.round(scrollLeft / slideWidth);
            document.querySelectorAll('.dot').forEach((dot,i)=> dot.classList.toggle('active', i===index));
            currentImageIndex = index;
        };
        container.addEventListener('scroll', updateDots);
        window.scrollToImage = (idx) => { container.scrollTo({ left: idx * container.clientWidth, behavior: 'smooth' }); };
        document.getElementById('carousel-prev').onclick = () => { if(currentImageIndex>0) scrollToImage(currentImageIndex-1); };
        document.getElementById('carousel-next').onclick = () => { if(currentImageIndex<images.length-1) scrollToImage(currentImageIndex+1); };
        setTimeout(updateDots,100);
        if(images.length<=1){ document.getElementById('carousel-prev').style.display='none'; document.getElementById('carousel-next').style.display='none'; }
        else{ document.getElementById('carousel-prev').style.display='flex'; document.getElementById('carousel-next').style.display='flex'; }
    }
    
    function getProductImages(product){
        if(!product.image_url) return ['https://via.placeholder.com/400/f3f4f6/9ca3af?text=Producto'];
        const urls = product.image_url.split(',').map(u=>u.trim()).filter(u=>u);
        return urls.length ? urls : ['https://via.placeholder.com/400/f3f4f6/9ca3af?text=Producto'];
    }
    
    async function loadProducts(search='', cat='all'){
        let query = supabase.from('products').select('*').eq('is_active',true);
        if(search) query = query.or(`name.ilike.%${search}%,description.ilike.%${search}%`);
        if(cat !== 'all') query = query.eq('category',cat);
        const {data,error} = await query.order('created_at',{ascending:false});
        if(!error){ products = data || []; renderProducts(products); }
    }
    
    function renderProducts(list){
        const container = document.getElementById('products-list');
        const noDiv = document.getElementById('no-products');
        if(!list.length){ container.innerHTML=''; noDiv.classList.remove('hidden'); return; }
        noDiv.classList.add('hidden');
        container.innerHTML = list.map(p => {
            const stockClass = p.stock>10?'stock-available':(p.stock>0?'stock-low':'stock-out');
            const stockText = p.stock>10?'Disponible':(p.stock>0?`${p.stock} uds`:'Agotado');
            return `<div class="product-card" data-id="${p.id}">
                <div class="relative"><img src="${p.image_url?.split(',')[0]?.trim() || 'https://via.placeholder.com/300/f3f4f6/9ca3af?text=Producto'}" class="product-image"><span class="stock-badge ${stockClass}">${stockText}</span></div>
                <div class="p-3"><div class="product-name">${p.name}</div><div class="product-description">${p.description || ''}</div><div class="flex justify-between items-center"><span class="product-price">${formatCurrency(p.price)}</span><button class="buy-btn" data-id="${p.id}">${p.stock===0?'Agotado':'Comprar'}</button></div></div>
            </div>`;
        }).join('');
        document.querySelectorAll('.buy-btn').forEach(btn=> btn.addEventListener('click',(e)=>{ e.stopPropagation(); const id=btn.dataset.id; const prod=products.find(p=>p.id===id); if(prod) openProductDetail(prod); }));
        document.querySelectorAll('.product-card').forEach(card=> card.addEventListener('click',()=>{ const id=card.dataset.id; const prod=products.find(p=>p.id===id); if(prod) openProductDetail(prod); }));
    }
    
    function openProductDetail(product){
        currentProduct = product; selectedQuantity = 1; selectedDeliveryTime = null; selectedLocationCoords = null; selectedLocationName = '';
        document.getElementById('delivery-address-name').value = ''; document.getElementById('delivery-notes').value = '';
        document.querySelectorAll('.time-option').forEach(opt=>opt.classList.remove('selected'));
        document.getElementById('product-detail-title').innerText = product.name;
        document.getElementById('product-detail-description').innerText = product.description || 'Sin descripción';
        document.getElementById('product-detail-price').innerHTML = formatCurrency(product.price);
        document.getElementById('product-detail-stock').innerHTML = `${product.stock} unidades`;
        const images = getProductImages(product);
        productImages = images;
        renderCarousel(images);
        updateQuantityUI(); updateBuyButton();
        openModal('product-detail-modal');
    }
    
    function updateQuantityUI(){
        document.getElementById('quantity-display').innerText = selectedQuantity;
        document.getElementById('decrease-quantity').disabled = selectedQuantity<=1;
        document.getElementById('increase-quantity').disabled = selectedQuantity>=currentProduct.stock;
        document.getElementById('total-price').innerText = formatCurrency(selectedQuantity * currentProduct.price);
    }
    
    function updateBuyButton(){
        const btn = document.getElementById('buy-product-btn');
        const addr = document.getElementById('delivery-address-name').value.trim();
        const hasStock = currentProduct.stock >= selectedQuantity;
        const hasLocation = !!selectedLocationCoords;
        const hasAddr = addr.length>0;
        const hasTime = !!selectedDeliveryTime;
        const hasBalance = currentBalance >= (selectedQuantity * currentProduct.price);
        btn.disabled = !(hasStock && hasLocation && hasAddr && hasTime && hasBalance);
        if(!hasStock) btn.innerHTML = '<i class="fas fa-times-circle"></i> Sin stock';
        else if(!hasLocation) btn.innerHTML = '<i class="fas fa-map-marker-alt"></i> Selecciona ubicación';
        else if(!hasAddr) btn.innerHTML = '<i class="fas fa-home"></i> Nombre del lugar';
        else if(!hasTime) btn.innerHTML = '<i class="fas fa-clock"></i> Selecciona hora';
        else if(!hasBalance) btn.innerHTML = '<i class="fas fa-wallet"></i> Saldo insuficiente';
        else btn.innerHTML = '<i class="fas fa-shopping-cart"></i> Comprar ahora';
    }
    
    async function getLocationName(lat,lng){
        try{
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18`);
            const data = await res.json();
            selectedLocationName = data.display_name?.split(',')[0] || 'Ubicación seleccionada';
        }catch(e){ selectedLocationName = `Ubicación (${lat.toFixed(4)},${lng.toFixed(4)})`; }
        updateLocationPreview();
    }
    
    function updateLocationPreview(){
        const preview = document.getElementById('location-preview');
        const previewText = document.getElementById('location-preview-text');
        const previewCoords = document.getElementById('location-preview-coords');
        const gmapsDiv = document.getElementById('gmaps-link-container');
        if(selectedLocationCoords){
            preview.classList.remove('hidden');
            previewText.innerText = selectedLocationName;
            previewCoords.innerText = `${selectedLocationCoords[0].toFixed(6)}, ${selectedLocationCoords[1].toFixed(6)}`;
            const link = generateGoogleMapsLink(selectedLocationCoords[0],selectedLocationCoords[1],selectedLocationName);
            gmapsDiv.innerHTML = `<a href="${link}" target="_blank" class="text-purple-600 text-xs"><i class="fas fa-external-link-alt"></i> Google Maps</a>`;
            const nameField = document.getElementById('delivery-address-name');
            if(!nameField.value.trim()) nameField.value = selectedLocationName;
        } else { preview.classList.add('hidden'); gmapsDiv.innerHTML = ''; }
    }
    
    function initFullscreenMap(){
        const center = selectedLocationCoords || [-16.5,-68.15];
        fullscreenMap = L.map('fullscreen-map').setView(center, selectedLocationCoords?16:13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(fullscreenMap);
        fullscreenMap.on('click',(e)=>{ if(tempMarker) fullscreenMap.removeLayer(tempMarker); tempMarker = L.circleMarker(e.latlng,{color:'#dc2626',radius:10,fill:true}).addTo(fullscreenMap); document.getElementById('confirm-location-btn').disabled=false; window.tempCoords=[e.latlng.lat, e.latlng.lng]; });
        document.getElementById('locate-me-btn')?.addEventListener('click',()=>{ navigator.geolocation.getCurrentPosition(pos=> fullscreenMap.setView([pos.coords.latitude,pos.coords.longitude],16)); });
        document.getElementById('zoom-in-btn')?.addEventListener('click',()=>fullscreenMap.zoomIn());
        document.getElementById('zoom-out-btn')?.addEventListener('click',()=>fullscreenMap.zoomOut());
    }
    
    function openMapModal(){
        openModal('map-modal');
        setTimeout(()=>{ if(!fullscreenMap) initFullscreenMap(); else fullscreenMap.invalidateSize(); document.getElementById('confirm-location-btn').disabled = !window.tempCoords; },100);
    }
    
    function confirmMapLocation(){
        if(window.tempCoords){
            selectedLocationCoords = window.tempCoords;
            getLocationName(selectedLocationCoords[0], selectedLocationCoords[1]);
            closeModal('map-modal');
            if(tempMarker && fullscreenMap) fullscreenMap.removeLayer(tempMarker);
            window.tempCoords = null;
            updateBuyButton();
        }
    }
    
    async function processPurchase(){
        const total = selectedQuantity * currentProduct.price;
        const addressName = document.getElementById('delivery-address-name').value.trim();
        const notes = document.getElementById('delivery-notes').value.trim();
        const timeOpt = document.querySelector('.time-option.selected');
        const deliveryTimeText = timeOpt ? timeOpt.querySelector('.time-label')?.innerText +' '+ timeOpt.dataset.time : '';
        const coords = selectedLocationCoords ? `${selectedLocationCoords[0]},${selectedLocationCoords[1]}` : '';
        const gmapsLink = selectedLocationCoords ? generateGoogleMapsLink(selectedLocationCoords[0],selectedLocationCoords[1],addressName) : '';
        
        const msg = `🛍️ NUEVA COMPRA\nProducto: ${currentProduct.name}\nCantidad: ${selectedQuantity}\nTotal: ${total} Bs\nLugar: ${addressName}\nCoords: ${coords}\n${gmapsLink}\nHora: ${deliveryTimeText}\nCliente: ${userProfile?.full_name || currentUser.email}`;
        await sendTelegramMessage(msg);
        
        const { data: tx } = await supabase.from('transactions').insert([{ user_id: currentUser.id, amount: total, type: 'withdrawal', status: 'completed' }]).select().single();
        if(!tx) throw new Error('Error transacción');
        
        const { data: productData } = await supabase.from('products').select('stock').eq('id',currentProduct.id).single();
        await supabase.from('products').update({ stock: productData.stock - selectedQuantity }).eq('id',currentProduct.id);
        await supabase.from('product_purchases').insert([{ user_id: currentUser.id, product_id: currentProduct.id, quantity: selectedQuantity, unit_price: currentProduct.price, total_price: total, transaction_id: tx.id, status: 'completed', delivery_address: addressName, delivery_notes: notes }]);
        
        currentBalance -= total;
        document.getElementById('current-balance').innerText = formatCurrency(currentBalance);
        closeModal('confirmation-modal');
        closeModal('product-detail-modal');
        openModal('result-modal');
        document.getElementById('result-title').innerText = '¡Compra exitosa!';
        document.getElementById('result-message').innerText = `Se descontaron ${formatCurrency(total)}`;
        
        const invoiceHTML = `<div class="text-center"><b>TokTok Shop</b><br>Comprobante<br>${new Date().toLocaleString()}<br>${currentProduct.name} x${selectedQuantity}<br>Total: ${formatCurrency(total)}<br>Entrega: ${addressName}<br>${gmapsLink ? `<a href="${gmapsLink}" target="_blank">Ver mapa</a>` : ''}</div>`;
        document.getElementById('invoice-content').innerHTML = invoiceHTML;
        setTimeout(()=> openModal('invoice-modal'), 500);
    }
    
    document.addEventListener('DOMContentLoaded', async()=>{
        const { data:{session} } = await supabase.auth.getSession();
        if(!session) return window.location='index.html';
        currentUser = session.user;
        const { data:profile } = await supabase.from('user_profiles').select('*').eq('id',currentUser.id).single();
        userProfile = profile;
        const { data:txs } = await supabase.from('transactions').select('amount,type').eq('user_id',currentUser.id).eq('status','completed');
        currentBalance = (txs||[]).reduce((acc,t)=> t.type==='deposit'? acc+t.amount : acc-t.amount,0);
        document.getElementById('current-balance').innerText = formatCurrency(currentBalance);
        await loadProducts();
        
        document.getElementById('product-search').addEventListener('input', e=> loadProducts(e.target.value, currentCategory));
        document.querySelectorAll('.category-btn').forEach(btn=> btn.addEventListener('click',()=>{
            document.querySelectorAll('.category-btn').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active'); currentCategory = btn.dataset.category;
            loadProducts(document.getElementById('product-search').value, currentCategory);
        }));
        document.getElementById('increase-quantity').addEventListener('click',()=>{ if(selectedQuantity < currentProduct?.stock) { selectedQuantity++; updateQuantityUI(); updateBuyButton(); } });
        document.getElementById('decrease-quantity').addEventListener('click',()=>{ if(selectedQuantity > 1) { selectedQuantity--; updateQuantityUI(); updateBuyButton(); } });
        document.querySelectorAll('.time-option').forEach(opt=> opt.addEventListener('click',()=>{ document.querySelectorAll('.time-option').forEach(o=>o.classList.remove('selected')); opt.classList.add('selected'); selectedDeliveryTime=opt.dataset.time; updateBuyButton(); }));
        document.getElementById('open-map-btn').addEventListener('click', openMapModal);
        document.getElementById('close-map-modal').addEventListener('click',()=>closeModal('map-modal'));
        document.getElementById('confirm-location-btn').addEventListener('click', confirmMapLocation);
        document.getElementById('delivery-address-name').addEventListener('input', updateBuyButton);
        document.getElementById('close-product-detail').addEventListener('click',()=>closeModal('product-detail-modal'));
        document.getElementById('buy-product-btn').addEventListener('click',()=> openModal('confirmation-modal'));
        document.getElementById('confirm-purchase').addEventListener('click', processPurchase);
        document.getElementById('cancel-purchase').addEventListener('click',()=>closeModal('confirmation-modal'));
        document.getElementById('close-result-modal').addEventListener('click',()=>{ closeModal('result-modal'); window.location.reload(); });
        document.getElementById('close-invoice-modal').addEventListener('click',()=>closeModal('invoice-modal'));
        document.getElementById('close-invoice').addEventListener('click',()=>closeModal('invoice-modal'));
        document.getElementById('download-invoice').addEventListener('click',()=>{ html2canvas(document.getElementById('invoice-content')).then(canvas=>{ let a=document.createElement('a'); a.download='factura.png'; a.href=canvas.toDataURL(); a.click(); }); });
    });
</script>
</body>
