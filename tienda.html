<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TokTok Shop | Tienda Moderna</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #8b5cf6;
            --primary-dark: #7c3aed;
            --primary-glow: rgba(139, 92, 246, 0.2);
            --dark: #0f172a;
            --gray-bg: #f1f5f9;
            --card-radius: 24px;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #f8fafc 0%, #f1f5f9 100%);
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        /* Scroll suave y moderno */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        
        /* Tarjetas modernas con efecto vidrio */
        .product-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(0px);
            border-radius: var(--card-radius);
            transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 4px rgba(0,0,0,0.02);
            height: 100%;
            overflow: hidden;
        }
        
        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.12);
            border-color: rgba(139, 92, 246, 0.2);
        }
        
        /* Contenedor de imágenes múltiples */
        .product-images-slider {
            position: relative;
            width: 100%;
            height: 150px;
            background: #f8fafc;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        
        .slider-container {
            width: 100%;
            height: 100%;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            border-radius: 18px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }
        
        .slider-container::-webkit-scrollbar {
            height: 3px;
        }
        
        .slider-image {
            flex: 0 0 100%;
            scroll-snap-align: start;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #eef2ff;
        }
        
        .slider-dots {
            position: absolute;
            bottom: 8px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 6px;
            z-index: 5;
        }
        
        .slider-dot {
            width: 6px;
            height: 6px;
            border-radius: 10px;
            background: rgba(255,255,255,0.6);
            transition: all 0.2s;
        }
        
        .slider-dot.active {
            width: 16px;
            background: white;
            box-shadow: 0 0 4px rgba(0,0,0,0.2);
        }
        
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(4px);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 6;
            font-size: 12px;
            font-weight: bold;
            color: #1e293b;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        
        .nav-arrow:hover {
            background: white;
            transform: translateY(-50%) scale(1.05);
        }
        
        .nav-left { left: 8px; }
        .nav-right { right: 8px; }
        
        .product-price {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            font-weight: 800;
            font-size: 1rem;
        }
        
        /* Badges modernos */
        .stock-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: -0.2px;
            backdrop-filter: blur(4px);
        }
        
        .stock-available {
            background: #10b98120;
            color: #059669;
            border: 1px solid #10b98140;
        }
        
        .stock-low {
            background: #f59e0b20;
            color: #d97706;
            border: 1px solid #f59e0b40;
        }
        
        .stock-out {
            background: #ef444420;
            color: #dc2626;
            border: 1px solid #ef444440;
        }
        
        /* Botón primario glassmorphism */
        .btn-primary {
            background: linear-gradient(105deg, #8b5cf6 0%, #7c3aed 100%);
            color: white;
            padding: 12px 18px;
            border-radius: 40px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
        }
        
        /* Modal moderno */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .modal.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal-content {
            background: white;
            width: 90%;
            max-width: 400px;
            border-radius: 32px;
            padding: 20px;
            transform: translateY(20px);
            transition: all 0.3s;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        
        .modal.active .modal-content {
            transform: translateY(0);
        }
        
        /* Header moderno */
        .mobile-header {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226,232,240,0.6);
        }
        
        /* Balance glass */
        .balance-display {
            background: linear-gradient(125deg, #8b5cf6, #6d28d9);
            border-radius: 24px;
            margin: 12px 16px;
            box-shadow: 0 8px 20px rgba(107, 70, 193, 0.25);
        }
        
        /* Inputs modernos */
        .input-field {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 12px 16px;
            transition: all 0.2s;
        }
        
        .input-field:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139,92,246,0.15);
            outline: none;
        }
        
        .category-btn {
            padding: 8px 18px;
            border-radius: 40px;
            background: white;
            border: 1px solid #e2e8f0;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .category-btn.active {
            background: #8b5cf6;
            color: white;
            border-color: #8b5cf6;
            box-shadow: 0 4px 8px rgba(139,92,246,0.3);
        }
        
        /* Selector de hora moderno */
        .time-option {
            background: white;
            border-radius: 20px;
            transition: all 0.2s;
        }
        
        .time-option.selected {
            background: #8b5cf6;
            color: white;
            border-color: #8b5cf6;
            transform: scale(0.98);
        }
        
        /* Grid responsive */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            gap: 14px;
            padding: 4px 2px;
        }
        
        /* Map button moderno */
        .map-btn {
            background: linear-gradient(125deg, #4f46e5, #7c3aed);
            border-radius: 60px;
            font-weight: 600;
        }
        
        .buy-btn {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            border-radius: 30px;
            font-weight: 600;
            padding: 8px 14px;
            font-size: 12px;
        }
        
        /* Animación de carga */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        /* Swipe para imágenes */
        .product-detail-image-container {
            position: relative;
            width: 100%;
            height: 220px;
            background: #f1f5f9;
            border-radius: 28px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        
        .detail-slider {
            width: 100%;
            height: 100%;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
        }
        
        .detail-slider-img {
            flex: 0 0 100%;
            scroll-snap-align: start;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #fefce8;
        }
    </style>
</head>
<body>
    <div class="mobile-only">
        <div class="mobile-header sticky top-0 z-40 bg-white/80 backdrop-blur-lg px-5 py-3 flex items-center justify-between border-b border-gray-100">
            <div class="flex items-center gap-2">
                <i class="fas fa-store text-purple-600 text-xl"></i>
                <div class="mobile-header-title font-extrabold text-gray-800 text-lg">TokTok Shop</div>
            </div>
            <a href="dashboard.html" class="text-purple-600 bg-purple-50 w-8 h-8 rounded-full flex items-center justify-center">
                <i class="fas fa-arrow-left text-sm"></i>
            </a>
        </div>
        
        <div class="balance-display">
            <div>
                <div class="balance-label text-white/80 text-xs">Saldo disponible</div>
                <div id="current-balance" class="balance-amount text-white text-xl font-bold">Cargando...</div>
            </div>
            <i class="fas fa-wallet text-white/70 text-2xl"></i>
        </div>
        
        <div class="search-container px-4 pt-2 pb-2">
            <input type="text" id="product-search" class="search-input w-full bg-gray-50/80 rounded-2xl border border-gray-200 py-3 pl-11 pr-4 text-sm" placeholder="Buscar productos...">
        </div>
        
        <div class="category-filters flex gap-2 px-4 py-2 overflow-x-auto">
            <button class="category-btn active" data-category="all">Todos</button>
            <button class="category-btn" data-category="Electrónica">Electrónica</button>
            <button class="category-btn" data-category="Ropa">Ropa</button>
            <button class="category-btn" data-category="Libros">Libros</button>
            <button class="category-btn" data-category="Hogar">Hogar</button>
        </div>
        
        <div class="products-container px-4 py-4">
            <div class="products-grid" id="products-list"></div>
        </div>
        
        <div id="no-products" class="hidden text-center py-12 px-4">
            <i class="fas fa-search text-4xl text-gray-300 mb-3"></i>
            <p class="text-gray-500 font-medium">No se encontraron productos</p>
        </div>
    </div>

    <!-- Modal de detalles con slider multiple imagenes -->
    <div id="product-detail-modal" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-extrabold text-gray-800" id="product-detail-title"></h3>
                <button id="close-product-detail" class="text-gray-400 hover:text-gray-600 bg-gray-100 w-8 h-8 rounded-full">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <!-- Contenedor slider imagenes múltiples -->
            <div class="product-detail-image-container">
                <div class="detail-slider" id="detail-slider"></div>
                <div class="slider-dots" id="detail-dots"></div>
                <div class="nav-arrow nav-left" id="detail-prev"><i class="fas fa-chevron-left"></i></div>
                <div class="nav-arrow nav-right" id="detail-next"><i class="fas fa-chevron-right"></i></div>
            </div>
            
            <p id="product-detail-description" class="text-gray-600 mb-4 text-sm leading-relaxed"></p>
            
            <div class="flex justify-between items-center mb-4 bg-gray-50 p-3 rounded-2xl">
                <div>
                    <div class="text-xs text-gray-500">Stock disponible</div>
                    <div id="product-detail-stock" class="text-base font-bold"></div>
                </div>
                <div class="text-right">
                    <div class="text-xs text-gray-500">Precio</div>
                    <div id="product-detail-price" class="product-price text-xl font-extrabold"></div>
                </div>
            </div>
            
            <div class="quantity-selector flex items-center justify-center gap-6 my-4">
                <button id="decrease-quantity" class="quantity-btn w-10 h-10 rounded-full bg-gray-100 text-gray-700 font-bold text-lg">-</button>
                <div id="quantity-display" class="quantity-display text-xl font-bold w-12 text-center">1</div>
                <button id="increase-quantity" class="quantity-btn w-10 h-10 rounded-full bg-gray-100 text-gray-700 font-bold text-lg">+</button>
            </div>
            
            <div class="text-center mb-5">
                <div class="text-xs text-gray-500">Total a pagar</div>
                <div id="total-price" class="text-2xl font-black text-purple-600"></div>
            </div>
            
            <div class="delivery-section bg-gray-50/80 rounded-2xl p-4 mb-5">
                <div class="section-title flex items-center gap-2 font-bold text-gray-700 mb-3">
                    <i class="fas fa-truck text-purple-600"></i> Entrega
                </div>
                <button id="open-map-btn" class="map-btn w-full py-3 rounded-xl flex items-center justify-center gap-2">
                    <i class="fas fa-map-marked-alt"></i> Seleccionar ubicación
                </button>
                <div id="location-preview" class="location-preview hidden mt-3 bg-white p-3 rounded-xl border cursor-pointer" onclick="openMapModal()">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-1 text-purple-600 font-semibold text-sm"><i class="fas fa-map-marker-alt"></i> Ubicación</div>
                        <div class="text-purple-600 text-xs font-medium">Cambiar</div>
                    </div>
                    <div id="location-preview-text" class="text-gray-700 text-sm mt-1"></div>
                    <div id="location-preview-coords" class="text-gray-400 text-xs mt-1"></div>
                    <div id="gmaps-link-container" class="mt-1"></div>
                </div>
                <div class="mt-3">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Nombre del lugar *</label>
                    <input type="text" id="delivery-address-name" class="input-field w-full rounded-xl" placeholder="Ej: Casa, Oficina">
                </div>
                <div class="mt-3">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Hora de entrega *</label>
                    <div class="time-selector grid grid-cols-2 gap-2">
                        <div class="time-option p-2 text-center rounded-xl border" data-time="09:00-12:00"><span class="block text-sm font-medium">Mañana</span><span class="text-xs">9:00 - 12:00</span></div>
                        <div class="time-option p-2 text-center rounded-xl border" data-time="12:00-15:00"><span class="block text-sm font-medium">Mediodía</span><span class="text-xs">12:00 - 15:00</span></div>
                        <div class="time-option p-2 text-center rounded-xl border" data-time="15:00-18:00"><span class="block text-sm font-medium">Tarde</span><span class="text-xs">15:00 - 18:00</span></div>
                        <div class="time-option p-2 text-center rounded-xl border" data-time="18:00-21:00"><span class="block text-sm font-medium">Noche</span><span class="text-xs">18:00 - 21:00</span></div>
                    </div>
                </div>
                <div class="mt-3">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Notas (opcional)</label>
                    <textarea id="delivery-notes" class="input-field w-full rounded-xl" rows="2" placeholder="Instrucciones especiales..."></textarea>
                </div>
            </div>
            
            <button id="buy-product-btn" class="w-full btn-primary py-3 rounded-xl" disabled>Comprar ahora</button>
        </div>
    </div>

    <!-- Modal mapa, confirmación, resultado, factura (sin cambios) -->
    <div id="map-modal" class="modal map-modal"><div class="modal-content"><div class="map-modal-header"><h3 class="font-bold">Selecciona punto de entrega</h3><button id="close-map-modal"><i class="fas fa-times"></i></button></div><div class="map-modal-body"><div id="fullscreen-map" style="height: 100%;"></div><div class="map-controls"><button id="locate-me-btn" class="control-btn"><i class="fas fa-location-crosshairs"></i></button><button id="zoom-in-btn"><i class="fas fa-plus"></i></button><button id="zoom-out-btn"><i class="fas fa-minus"></i></button></div></div><div class="map-footer"><button id="confirm-location-btn" class="map-footer-btn">Confirmar ubicación</button></div></div></div>
    <div id="confirmation-modal" class="modal"><div class="modal-content"><div class="flex justify-between items-center"><h3 class="font-bold">Confirmar compra</h3><button id="close-confirmation-modal"><i class="fas fa-times"></i></button></div><div id="confirmation-text" class="my-4"></div><div class="flex gap-2"><button id="cancel-purchase" class="flex-1 py-2 rounded-xl bg-gray-100">Cancelar</button><button id="confirm-purchase" class="flex-1 py-2 rounded-xl bg-purple-600 text-white">Confirmar</button></div></div></div>
    <div id="result-modal" class="modal"><div class="modal-content text-center"><div id="result-icon" class="text-5xl mb-2"><i class="fas fa-check-circle text-green-500"></i></div><h3 id="result-title" class="font-bold text-lg">Éxito</h3><p id="result-message" class="text-gray-600 text-sm my-2"></p><button id="close-result-modal" class="btn-primary w-full mt-2">Aceptar</button></div></div>
    <div id="invoice-modal" class="modal"><div class="modal-content"><div class="flex justify-between"><span class="font-bold">Comprobante</span><button id="close-invoice-modal"><i class="fas fa-times"></i></button></div><div id="invoice-content"></div><button id="download-invoice" class="btn-primary w-full mt-2">Descargar</button></div></div>

    <script>
        const supabaseUrl = 'https://aleadadisazocjovibeh.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsZWFkYWRpc2F6b2Nqb3ZpYmVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0NDE5NjMsImV4cCI6MjA3NTAxNzk2M30.z82tP0C-UiiNuzP_jqrQf4LBusFqrDi1WYbdnuTh47E';
        window.supabase = supabase.createClient(supabaseUrl, supabaseKey);
        
        let currentUser = null, userProfile = null, currentBalance = 0, currentProduct = null, selectedQuantity = 1, selectedDeliveryTime = null, currentInvoiceData = null, products = [], currentCategory = 'all';
        let fullscreenMap = null, currentLocationMarker = null, selectedLocation = null, selectedLocationCoords = null, selectedLocationName = '', tempMarker = null;
        const TELEGRAM_BOT_TOKEN = '7596286871:AAGFe3sHy-GhykyM_xsFwDU8qrt6SWXSWHY', TELEGRAM_CHAT_ID = '-5155315945';
        
        const formatCurrency = (amount) => 'Bs ' + parseFloat(amount).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        const showToast = (msg, type='success') => { const t=document.createElement('div'); t.className=`fixed bottom-20 left-4 right-4 bg-gray-900 text-white text-center py-2 px-4 rounded-full text-sm z-50`; t.innerText=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2500); };
        const generateGoogleMapsLink = (lat,lng,label='Entrega') => `https://www.google.com/maps?q=${lat},${lng}&label=${encodeURIComponent(label)}`;
        const sendTelegramMessage = async (msg) => { try{ const r=await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:TELEGRAM_CHAT_ID,text:msg,parse_mode:'HTML'})}); return (await r.json()).ok; }catch(e){ return false; } };
        const openModal = (id) => { document.getElementById(id).classList.add('active'); document.body.style.overflow='hidden'; };
        const closeModal = (id) => { document.getElementById(id).classList.remove('active'); document.body.style.overflow=''; };
        
        // Funciones para múltiples imágenes (split por comas)
        function getImageArray(product) {
            if(!product.image_url) return ['https://via.placeholder.com/400x300/f1f5f9/64748b?text=Sin+imagen'];
            return product.image_url.split(',').map(img => img.trim()).filter(img => img.length > 0);
        }
        
        function renderProductImages(images, containerId, dotsId, prevId, nextId) {
            const container = document.getElementById(containerId);
            const dotsContainer = document.getElementById(dotsId);
            if(!container) return;
            container.innerHTML = '';
            images.forEach((img, idx) => {
                const imgEl = document.createElement('img');
                imgEl.src = img;
                imgEl.className = 'detail-slider-img';
                imgEl.style.objectFit = 'cover';
                container.appendChild(imgEl);
            });
            if(dotsContainer && images.length > 1) {
                dotsContainer.innerHTML = '';
                images.forEach((_, idx) => {
                    const dot = document.createElement('div');
                    dot.className = 'slider-dot';
                    if(idx === 0) dot.classList.add('active');
                    dot.addEventListener('click', () => { container.scrollTo({ left: idx * container.clientWidth, behavior: 'smooth' }); });
                    dotsContainer.appendChild(dot);
                });
                container.addEventListener('scroll', () => {
                    const index = Math.round(container.scrollLeft / container.clientWidth);
                    document.querySelectorAll(`#${dotsId} .slider-dot`).forEach((d, i) => i === index ? d.classList.add('active') : d.classList.remove('active'));
                });
            }
            if(prevId && nextId && images.length > 1) {
                const prevBtn = document.getElementById(prevId), nextBtn = document.getElementById(nextId);
                prevBtn.onclick = () => container.scrollBy({ left: -container.clientWidth, behavior: 'smooth' });
                nextBtn.onclick = () => container.scrollBy({ left: container.clientWidth, behavior: 'smooth' });
                prevBtn.style.display = 'flex'; nextBtn.style.display = 'flex';
            } else if(prevId && nextId) {
                document.getElementById(prevId).style.display = 'none';
                document.getElementById(nextId).style.display = 'none';
            }
        }
        
        // Renderizar productos con slider
        function renderProducts(productsToRender) {
            const container = document.getElementById('products-list');
            const noProducts = document.getElementById('no-products');
            if(!productsToRender.length) { container.innerHTML=''; noProducts.classList.remove('hidden'); return; }
            noProducts.classList.add('hidden');
            container.innerHTML = productsToRender.map(product => {
                const images = getImageArray(product);
                const stockClass = product.stock > 10 ? 'stock-available' : (product.stock > 0 ? 'stock-low' : 'stock-out');
                const stockText = product.stock > 10 ? 'Disponible' : (product.stock > 0 ? `${product.stock} unid.` : 'Agotado');
                const sliderId = `slider-${product.id}`;
                return `<div class="product-card" data-product-id="${product.id}">
                    <div class="p-3">
                        <div class="product-images-slider" style="height:140px">
                            <div class="slider-container" id="${sliderId}"></div>
                            <div class="slider-dots" id="dots-${product.id}"></div>
                        </div>
                        <h3 class="font-bold text-gray-800 mt-2 text-sm">${product.name}</h3>
                        <p class="text-xs text-gray-500 mt-1 line-clamp-2">${product.description || ''}</p>
                        <div class="flex justify-between items-center mt-3">
                            <div class="product-price text-base font-black">${formatCurrency(product.price)}</div>
                            <button class="buy-btn ${product.stock===0?'opacity-50':''}" ${product.stock===0?'disabled':''}>${product.stock===0?'Agotado':'Comprar'}</button>
                        </div>
                    </div>
                </div>`;
            }).join('');
            
            productsToRender.forEach(product => {
                const images = getImageArray(product);
                const sliderContainer = document.getElementById(`slider-${product.id}`);
                if(sliderContainer) {
                    sliderContainer.innerHTML = images.map(img => `<img src="${img}" class="slider-image" style="flex:0 0 100%">`).join('');
                    const dotsDiv = document.getElementById(`dots-${product.id}`);
                    if(images.length>1 && dotsDiv) {
                        dotsDiv.innerHTML = images.map((_,i)=>`<div class="slider-dot ${i===0?'active':''}"></div>`).join('');
                        sliderContainer.addEventListener('scroll', function() {
                            const idx = Math.round(this.scrollLeft / this.clientWidth);
                            Array.from(dotsDiv.children).forEach((dot,i)=>i===idx?dot.classList.add('active'):dot.classList.remove('active'));
                        });
                    }
                }
            });
            
            document.querySelectorAll('.product-card button:not([disabled])').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); const id = btn.closest('.product-card').dataset.productId; const p = products.find(p=>p.id===id); if(p) openProductDetail(p); }));
            document.querySelectorAll('.product-card').forEach(card => card.addEventListener('click', (e) => { if(!e.target.closest('button')){ const id=card.dataset.productId; const p=products.find(p=>p.id===id); if(p) openProductDetail(p); } }));
        }
        
        async function loadProducts(search='', cat='all') {
            let q = supabase.from('products').select('*').eq('is_active', true);
            if(search) q = q.or(`name.ilike.%${search}%,description.ilike.%${search}%`);
            if(cat !== 'all') q = q.eq('category', cat);
            const {data, error} = await q.order('created_at', {ascending:false});
            if(!error) { products = data || []; renderProducts(products); }
            else showToast('Error al cargar productos','error');
        }
        
        function openProductDetail(product) {
            currentProduct = product; selectedQuantity=1; selectedDeliveryTime=null;
            document.querySelectorAll('.time-option').forEach(opt=>opt.classList.remove('selected'));
            selectedLocationCoords = null; selectedLocation=null; selectedLocationName=''; updateLocationPreview();
            document.getElementById('delivery-address-name').value=''; document.getElementById('delivery-notes').value='';
            document.getElementById('product-detail-title').innerText = product.name;
            document.getElementById('product-detail-description').innerText = product.description || 'Sin descripción';
            document.getElementById('product-detail-price').innerHTML = formatCurrency(product.price);
            const stockSpan = document.getElementById('product-detail-stock');
            stockSpan.innerText = `${product.stock} unidades`;
            stockSpan.className = `text-base font-bold ${product.stock>0?'text-green-600':'text-red-500'}`;
            const images = getImageArray(product);
            renderProductImages(images, 'detail-slider', 'detail-dots', 'detail-prev', 'detail-next');
            updateQuantityUI(); updateBuyButton();
            openModal('product-detail-modal');
        }
        
        function updateQuantityUI() {
            document.getElementById('quantity-display').innerText = selectedQuantity;
            document.getElementById('decrease-quantity').disabled = selectedQuantity<=1;
            document.getElementById('increase-quantity').disabled = selectedQuantity>=currentProduct.stock;
            document.getElementById('total-price').innerText = formatCurrency(selectedQuantity * currentProduct.price);
        }
        
        function updateBuyButton() {
            const buyBtn = document.getElementById('buy-product-btn');
            const addr = document.getElementById('delivery-address-name').value.trim();
            const hasStock = currentProduct.stock >= selectedQuantity;
            const hasLoc = selectedLocationCoords !== null;
            const hasAddr = addr.length>0;
            const hasTime = selectedDeliveryTime !== null;
            const hasBalance = currentBalance >= (selectedQuantity*currentProduct.price);
            buyBtn.disabled = !(hasStock && hasLoc && hasAddr && hasTime && hasBalance);
            if(!hasStock) buyBtn.innerHTML = 'Sin stock';
            else if(!hasLoc) buyBtn.innerHTML = '📍 Selecciona ubicación';
            else if(!hasAddr) buyBtn.innerHTML = '🏠 Nombre del lugar';
            else if(!hasTime) buyBtn.innerHTML = '⏰ Selecciona hora';
            else if(!hasBalance) buyBtn.innerHTML = '💰 Saldo insuficiente';
            else buyBtn.innerHTML = '<i class="fas fa-shopping-cart"></i> Comprar ahora';
        }
        
        const loadUserProfile = async (uid) => { const {data}=await supabase.from('user_profiles').select('*').eq('id',uid).single(); return data; };
        const calculateBalance = async (uid) => { const {data}=await supabase.from('transactions').select('amount,type').eq('user_id',uid).eq('status','completed'); let bal=0; data?.forEach(t=>bal+=t.type==='deposit'?t.amount:-t.amount); return bal; };
        const createTransaction = async (uid,amt,type,desc,meta) => { const {data,error}=await supabase.from('transactions').insert([{user_id:uid,amount:amt,type,description:desc,metadata:meta,status:'completed'}]).select().single(); return error?null:data; };
        const createProductPurchase = async (pd) => {
            const {data:prod}=await supabase.from('products').select('stock').eq('id',pd.product_id).single();
            if(prod.stock < pd.quantity) throw new Error('Stock insuficiente');
            await supabase.from('products').update({stock:prod.stock-pd.quantity,updated_at:new Date()}).eq('id',pd.product_id);
            const {data,error}=await supabase.from('product_purchases').insert([pd]).select().single();
            if(error) throw error; return data;
        };
        
        function updateBalanceDisplay() { document.getElementById('current-balance').innerText = formatCurrency(currentBalance); }
        
        // Mapa (sin cambios, solo para mantener)
        function initFullscreenMap() { /* misma lógica original */ }
        function handleMapClick(e) { if(fullscreenMap){ if(tempMarker) fullscreenMap.removeLayer(tempMarker); tempMarker=L.circleMarker(e.latlng,{color:'#dc2626',fillColor:'#dc2626',radius:10}).addTo(fullscreenMap); document.getElementById('confirm-location-btn').disabled=false; window.tempCoords=[e.latlng.lat,e.latlng.lng]; } }
        function confirmMapLocation() { if(window.tempCoords){ setSelectedLocation(window.tempCoords); closeModal('map-modal'); if(tempMarker&&fullscreenMap)fullscreenMap.removeLayer(tempMarker); tempMarker=null; window.tempCoords=null; document.getElementById('confirm-location-btn').disabled=true; } }
        async function getLocationName(lat,lng) { try{ const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`); const d=await r.json(); selectedLocation=d.display_name; selectedLocationName=d.address?.road||d.display_name.split(',')[0]; const nameField=document.getElementById('delivery-address-name'); if(!nameField.value.trim()) nameField.value=selectedLocationName; updateLocationPreview(); }catch(e){ selectedLocationName='Ubicación seleccionada'; updateLocationPreview(); } }
        function setSelectedLocation(coords) { selectedLocationCoords=coords; getLocationName(coords[0],coords[1]); updateBuyButton(); }
        function updateLocationPreview() { const preview=document.getElementById('location-preview'); if(selectedLocationCoords){ preview.classList.remove('hidden'); document.getElementById('location-preview-text').innerText=selectedLocationName||'Ubicación'; document.getElementById('location-preview-coords').innerHTML=`${selectedLocationCoords[0].toFixed(5)}, ${selectedLocationCoords[1].toFixed(5)}`; document.getElementById('gmaps-link-container').innerHTML=`<a href="${generateGoogleMapsLink(selectedLocationCoords[0],selectedLocationCoords[1],selectedLocationName)}" target="_blank" class="text-purple-500 text-xs">Ver en Google Maps</a>`; } else preview.classList.add('hidden'); }
        function openMapModal() { openModal('map-modal'); setTimeout(()=>{ if(!fullscreenMap){ fullscreenMap=L.map('fullscreen-map').setView(selectedLocationCoords||[-16.5,-68.15],13); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(fullscreenMap); fullscreenMap.on('click',handleMapClick); document.getElementById('locate-me-btn')?.addEventListener('click',()=>{ navigator.geolocation.getCurrentPosition(p=>fullscreenMap.setView([p.coords.latitude,p.coords.longitude],16)); }); document.getElementById('zoom-in-btn')?.addEventListener('click',()=>fullscreenMap.zoomIn()); document.getElementById('zoom-out-btn')?.addEventListener('click',()=>fullscreenMap.zoomOut()); } else fullscreenMap.invalidateSize(); document.getElementById('confirm-location-btn').disabled=!window.tempCoords; },100); }
        
        function initiatePurchase() { /* igual */ const total=selectedQuantity*currentProduct.price; const addr=document.getElementById('delivery-address-name').value.trim(); const notes=document.getElementById('delivery-notes').value.trim(); const timeOpt=document.querySelector('.time-option.selected'); const timeText=timeOpt?`${timeOpt.querySelector('.time-label')?.innerText} (${timeOpt.querySelector('.time-value')?.innerText})`:''; const coords=selectedLocationCoords?`${selectedLocationCoords[0].toFixed(6)}, ${selectedLocationCoords[1].toFixed(6)}`:''; const gmaps=selectedLocationCoords?generateGoogleMapsLink(selectedLocationCoords[0],selectedLocationCoords[1],addr):''; document.getElementById('confirmation-text').innerHTML=`<div class="bg-gray-50 p-3 rounded-xl"><strong>${currentProduct.name}</strong><br>Cantidad: ${selectedQuantity}<br>Total: <span class="text-purple-600 font-bold">${formatCurrency(total)}</span></div><div class="text-xs mt-2"><div><strong>Lugar:</strong> ${addr}</div><div><strong>Coordenadas:</strong> ${coords}</div>${gmaps?`<div><a href="${gmaps}" target="_blank" class="text-blue-500">Abrir mapa</a></div>`:''}<div><strong>Hora:</strong> ${timeText}</div>${notes?`<div><strong>Notas:</strong> ${notes}</div>`:''}</div>`; openModal('confirmation-modal'); }
        
        async function processPurchase() {
            const confirmBtn=document.getElementById('confirm-purchase'); confirmBtn.disabled=true; confirmBtn.innerText='Procesando...';
            try{
                const total=selectedQuantity*currentProduct.price; const addr=document.getElementById('delivery-address-name').value.trim(); const notes=document.getElementById('delivery-notes').value.trim(); const timeOpt=document.querySelector('.time-option.selected'); const timeText=timeOpt?`${timeOpt.querySelector('.time-label')?.innerText} (${timeOpt.querySelector('.time-value')?.innerText})`:''; const coords=selectedLocationCoords?`${selectedLocationCoords[0].toFixed(6)}, ${selectedLocationCoords[1].toFixed(6)}`:''; const gmapsLink=selectedLocationCoords?generateGoogleMapsLink(selectedLocationCoords[0],selectedLocationCoords[1],addr):'';
                const msg=`🛍️ NUEVA COMPRA\n\n📦 ${currentProduct.name}\nCantidad: ${selectedQuantity}\nTotal: ${total} Bs\n📍 Entrega: ${addr}\nCoords: ${coords}\n🗺️ ${gmapsLink}\n⏰ ${timeText}\n👤 ${userProfile?.full_name||currentUser.email}\n📝 ${notes}`;
                await sendTelegramMessage(msg);
                const trans=await createTransaction(currentUser.id,total,'withdrawal',`Compra: ${selectedQuantity} ${currentProduct.name}`,{product_id:currentProduct.id});
                if(!trans) throw new Error('Error transacción');
                const purchase=await createProductPurchase({user_id:currentUser.id,product_id:currentProduct.id,quantity:selectedQuantity,unit_price:currentProduct.price,total_price:total,transaction_id:trans.id,status:'completed',delivery_address:addr,delivery_notes:notes});
                if(!purchase) throw new Error('Error compra');
                currentBalance-=total; updateBalanceDisplay();
                closeModal('confirmation-modal'); closeModal('product-detail-modal'); openModal('result-modal');
                showPurchaseInvoice({...purchase,product_name:currentProduct.name,delivery_time:timeText,delivery_address:addr,coordinates:coords});
            }catch(e){ showToast(e.message,'error'); } finally { confirmBtn.disabled=false; confirmBtn.innerText='Confirmar'; }
        }
        
        function showPurchaseInvoice(data) { const invId='PUR-'+Date.now().toString().slice(-8); const gmaps=data.coordinates?`<a href="${generateGoogleMapsLink(data.coordinates.split(',')[0],data.coordinates.split(',')[1],data.delivery_address)}" target="_blank">Ver mapa</a>`:''; document.getElementById('invoice-content').innerHTML=`<div class="p-2"><div class="text-center font-bold">TokTok Shop</div><div class="text-xs">${new Date().toLocaleString()}</div><div class="grid grid-cols-2 gap-1 text-xs mt-2"><span>Producto:</span><span>${data.product_name}</span><span>Cantidad:</span><span>${data.quantity}</span><span>Total:</span><span class="text-red-500">-${formatCurrency(data.total_price)}</span><span>Lugar:</span><span>${data.delivery_address}</span><span>Coords:</span><span>${data.coordinates}</span></div>${gmaps?`<div class="text-center mt-1">${gmaps}</div>`:''}<div class="text-center text-[10px] mt-2">Comprobante digital</div></div>`; openModal('invoice-modal'); currentInvoiceData={id:invId,purchase:data}; }
        function downloadInvoiceAsImage() { showToast('Descargando...'); const el=document.getElementById('invoice-content'); html2canvas(el,{scale:2}).then(canvas=>{const a=document.createElement('a'); a.download=`factura-${currentInvoiceData.id}.png`; a.href=canvas.toDataURL(); a.click(); }); }
        
        document.addEventListener('DOMContentLoaded', async () => {
            const {data:{session}} = await supabase.auth.getSession();
            if(!session) return window.location.href='index.html';
            currentUser=session.user; userProfile=await loadUserProfile(currentUser.id);
            if(!userProfile) window.location.href='index.html';
            currentBalance=await calculateBalance(currentUser.id); updateBalanceDisplay();
            await loadProducts();
            document.getElementById('product-search').addEventListener('input',(e)=>loadProducts(e.target.value,currentCategory));
            document.querySelectorAll('.category-btn').forEach(btn=>btn.addEventListener('click',()=>{ document.querySelectorAll('.category-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); currentCategory=btn.dataset.category; loadProducts(document.getElementById('product-search').value,currentCategory); }));
            document.getElementById('increase-quantity').addEventListener('click',()=>{ if(selectedQuantity<currentProduct.stock){ selectedQuantity++; updateQuantityUI(); updateBuyButton(); } });
            document.getElementById('decrease-quantity').addEventListener('click',()=>{ if(selectedQuantity>1){ selectedQuantity--; updateQuantityUI(); updateBuyButton(); } });
            document.querySelectorAll('.time-option').forEach(opt=>opt.addEventListener('click',()=>{ document.querySelectorAll('.time-option').forEach(o=>o.classList.remove('selected')); opt.classList.add('selected'); selectedDeliveryTime=opt.dataset.time; updateBuyButton(); }));
            document.getElementById('open-map-btn').addEventListener('click',openMapModal); document.getElementById('location-preview').addEventListener('click',openMapModal); document.getElementById('close-map-modal').addEventListener('click',()=>closeModal('map-modal')); document.getElementById('confirm-location-btn').addEventListener('click',confirmMapLocation);
            document.getElementById('delivery-address-name').addEventListener('input',updateBuyButton);
            document.getElementById('close-product-detail').addEventListener('click',()=>closeModal('product-detail-modal'));
            document.getElementById('buy-product-btn').addEventListener('click',initiatePurchase);
            document.getElementById('close-confirmation-modal').addEventListener('click',()=>closeModal('confirmation-modal'));
            document.getElementById('cancel-purchase').addEventListener('click',()=>closeModal('confirmation-modal'));
            document.getElementById('confirm-purchase').addEventListener('click',processPurchase);
            document.getElementById('close-result-modal').addEventListener('click',()=>{ closeModal('result-modal'); window.location.reload(); });
            document.getElementById('close-invoice-modal').addEventListener('click',()=>closeModal('invoice-modal'));
            document.getElementById('download-invoice').addEventListener('click',downloadInvoiceAsImage);
        });
    </script>
</body>
</html>
