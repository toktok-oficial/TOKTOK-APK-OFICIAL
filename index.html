<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mantenimiento</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  body {
    background: linear-gradient(180deg, #ffffff 0%, #f3e8ff 50%, #8a2be2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .phone {
    width: 100%;
    max-width: 420px;
    height: 100vh;
    max-height: 900px;
    background: #ffffff;
    border-radius: 30px;
    box-shadow: 0 20px 60px rgba(138, 43, 226, 0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
    position: relative;
    overflow: hidden;
  }

  .glow {
    position: absolute;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(138,43,226,0.35) 0%, transparent 70%);
    border-radius: 50%;
    top: -80px;
    right: -80px;
    z-index: 0;
  }

  .glow2 {
    position: absolute;
    width: 250px;
    height: 250px;
    background: radial-gradient(circle, rgba(255,0,255,0.2) 0%, transparent 70%);
    border-radius: 50%;
    bottom: -60px;
    left: -60px;
    z-index: 0;
  }

  .logo {
    font-size: 42px;
    font-weight: 900;
    color: #8a2be2;
    letter-spacing: 2px;
    margin-bottom: 10px;
    z-index: 1;
    text-shadow: 2px 2px 0 #ff00ff33;
  }

  .icon {
    font-size: 70px;
    margin-bottom: 20px;
    animation: spin 2.5s linear infinite;
    z-index: 1;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  h1 {
    font-size: 26px;
    color: #4b0082;
    margin-bottom: 12px;
    z-index: 1;
  }

  p {
    font-size: 16px;
    color: #6a0dad;
    margin-bottom: 25px;
    z-index: 1;
    line-height: 1.5;
  }

  .timer {
    font-size: 34px;
    font-weight: bold;
    color: #ffffff;
    background: linear-gradient(135deg, #8a2be2, #c084fc);
    padding: 12px 30px;
    border-radius: 50px;
    box-shadow: 0 8px 20px rgba(138,43,226,0.5);
    z-index: 1;
    margin-bottom: 25px;
    letter-spacing: 1px;
  }

  .bar {
    width: 100%;
    height: 10px;
    background: #f0e6ff;
    border-radius: 10px;
    overflow: hidden;
    z-index: 1;
    margin-bottom: 15px;
  }

  .bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #8a2be2, #ff00ff);
    border-radius: 10px;
    animation: fill 4s ease-in-out infinite;
  }

  @keyframes fill {
    0% { width: 0%; }
    50% { width: 90%; }
    100% { width: 0%; }
  }

  .footer {
    font-size: 13px;
    color: #a67ee0;
    z-index: 1;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="logo">TOKTOK</div>
  <div class="icon">🔧</div>
  <h1>Mantenimiento en curso</h1>
  <p>Estamos mejorando tu experiencia.<br>En instantes volvemos ✨</p>
  <div class="timer" id="timer">00:00</div>
  <div class="bar"><div class="bar-fill"></div></div>
  <div class="footer">Gracias por tu paciencia 💜</div>
</div>

<script>
  let seconds = 0;
  const timerEl = document.getElementById('timer');

  setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds / 60)).padStart(2, '0');
    const s = String(seconds % 60).padStart(2, '0');
    timerEl.textContent = `${m}:${s}`;
  }, 1000);
</script>

</body>
</html>
